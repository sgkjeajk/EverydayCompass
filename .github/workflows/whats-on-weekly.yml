name: What's On Daily Refresh

on:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/additional_sources.py
      - scripts/update_events.py
      - scripts/run_whats_on.py
      - tests/**
      - .github/workflows/whats-on-weekly.yml
  workflow_dispatch:
    inputs:
      recoveryTarget:
        description: Recovery window used by wake-up jobs to skip completed work
        required: false
        type: string
        default: ''
  schedule:
    # Daily 04:15 Singapore = 20:15 UTC on the previous date.
    - cron: '15 20 * * *'

permissions:
  contents: write

concurrency:
  group: everyday-compass-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      reader_review: ${{ steps.update.outputs.reader_review }}
      reader_review_details: ${{ steps.update.outputs.reader_review_details }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether this recovery is still needed
        id: recovery_check
        env:
          RECOVERY_TARGET: ${{ inputs.recoveryTarget }}
        shell: python
        run: |
          import json, os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.whats_on_wakeup import parse_time, feed_fresh
          value = os.environ.get("RECOVERY_TARGET", "")
          needed = True
          if value:
              target = parse_time(value)
              if target is None:
                  raise ValueError("Invalid recovery target")
              try:
                  with open("events.json", encoding="utf-8") as handle:
                      feed = json.load(handle)
              except (OSError, ValueError):
                  feed = {}
              needed = not feed_fresh(feed, target, datetime.now(timezone.utc))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"needed={'true' if needed else 'false'}\n")
          print("Refresh needed:", needed)
      - run: pip install requests beautifulsoup4 pytest playwright
        if: steps.recovery_check.outputs.needed == 'true'
      - name: Install browser for public JavaScript event listings
        if: steps.recovery_check.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Safety tests
        if: steps.recovery_check.outputs.needed == 'true'
        run: pytest -q
      - name: Update feed
        if: steps.recovery_check.outputs.needed == 'true'
        id: update
        run: python scripts/run_whats_on.py
      - name: Commit changed feed
        if: steps.recovery_check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update What's On events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # Runs AFTER the feed is saved, so finished events are still removed.
      # Failing here marks the run red on the Actions page and triggers GitHub's failure notification.
      - name: Fail the run if every source returned zero events
        if: steps.recovery_check.outputs.needed == 'true' && steps.update.outputs.all_sources_failed == 'true'
        run: |
          echo "::error::Every What's On source returned zero events. Previous events were kept and finished events removed. Check the source list and the websites."
          exit 1

  reader-enhancement-alert:
    name: Enhancement review - source may need a custom reader
    needs: refresh
    if: always() && needs.refresh.outputs.reader_review == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Flag source reader review for GitHub failure email
        env:
          READER_REVIEW_DETAILS: ${{ needs.refresh.outputs.reader_review_details }}
        shell: python
        run: |
          import json, os, html
          rows = json.loads(os.environ["READER_REVIEW_DETAILS"])
          lines = [
              "What's On refresh completed its source checks.",
              "Additional enhancement review: these sites returned no usable events.",
              "Check whether there are genuinely no current events or a custom reader is needed.",
              "Other sources were still processed; valid fallback events were preserved.",
          ]
          for row in rows:
              lines.append(f"{row['name']} | {row['url']} | {row['error']}")
          message = "\n".join(lines)
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("<pre>" + html.escape(message) + "</pre>\n")
          # Native Actions failure notifications link to this named job and its source details.
          raise SystemExit(1)
