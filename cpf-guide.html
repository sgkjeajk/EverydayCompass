<!DOCTYPE html>
<html lang="en" data-size="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPF answered plainly: CPF LIFE for seniors, growing CPF for adults</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF3FE; --ink:#1A2647; --muted:#556074; --card:#FFFFFF; --line:#D3DAED;
  --blue:#2D4AC0; --blue-soft:#E4E9FB; --green:#33725F; --green-soft:#E3F0EB; --strip:#BAC7FA;
  --seniors:var(--green); --seniors-soft:var(--green-soft);
  --adults:var(--blue); --adults-soft:var(--blue-soft);
  --warn-bg:#FFF1DC; --warn-ink:#7A4300; --warn-line:#EFCF9A;
  --accent:var(--seniors); --accent-soft:var(--seniors-soft);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%; font-size:16px}
html[data-size="2"]{font-size:20px}
html[data-size="3"]{font-size:23px}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:1.125rem; line-height:1.6;
  padding:env(safe-area-inset-top,0) 0 calc(90px + env(safe-area-inset-bottom,0));
}
body[data-cat="adults"]{--accent:var(--adults); --accent-soft:var(--adults-soft)}
.wrap{max-width:780px; margin:0 auto; padding:16px}
a{color:var(--accent)}
:focus-visible{outline:3px solid #E58A00; outline-offset:2px; border-radius:6px}

/* header */
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px}
h1{font-size:clamp(1.7rem,5.4vw,2.35rem); line-height:1.15; margin:0 0 6px; letter-spacing:-.01em}
.sub{margin:0; color:var(--muted); font-size:.95rem}
.gear{flex:none; min-width:52px; min-height:52px; border:2px solid var(--line); background:#fff; border-radius:14px; font:inherit; font-weight:700; cursor:pointer; color:var(--ink); padding:6px 12px}
.gear span{display:block; font-size:.72rem; line-height:1.1}
.gear b{font-size:1.3rem; line-height:1}

/* tabs */
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 18px}
.tab{font:inherit; text-align:left; cursor:pointer; padding:12px 14px; min-height:64px; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--ink)}
.tab strong{display:block; font-size:1.15rem; line-height:1.2}
.tab small{display:block; font-size:.9rem; color:var(--muted)}
.tab[data-cat="seniors"]{--c:var(--seniors)}
.tab[data-cat="adults"]{--c:var(--adults)}
.tab[aria-selected="true"]{background:var(--c); border-color:var(--c); color:#fff}
.tab[aria-selected="true"] small{color:#fff}
.panel-intro{margin:0 0 6px; font-size:1.02rem}
.panel-intro b{color:var(--accent)}

/* items */
.item{background:var(--card); border:2px solid var(--line); border-radius:16px; margin:12px 0; overflow:hidden}
.item.open{border-color:var(--accent)}
.qbtn{all:unset; box-sizing:border-box; width:100%; display:flex; gap:12px; align-items:center; padding:14px 16px; min-height:64px; cursor:pointer; font-weight:700; font-size:1.06rem; line-height:1.3}
.qbtn:focus-visible{outline:3px solid #E58A00; outline-offset:-3px}
.num{flex:none; width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:1rem}
.qtext{flex:1}
.chev{flex:none; transition:transform .2s; color:var(--muted)}
.item.open .chev{transform:rotate(180deg)}
.body{display:none; padding:2px 16px 18px}
.item.open .body{display:block}

.label{font-weight:700; font-size:.95rem; margin:14px 0 6px}
.kws{display:flex; flex-wrap:wrap; gap:8px}
.kw{font:inherit; font-size:.92rem; cursor:pointer; padding:7px 14px; min-height:48px; border-radius:999px; border:2px solid var(--accent); background:#fff; color:var(--accent)}
.kw[aria-pressed="true"]{background:var(--accent); color:#fff}
.answer{background:var(--accent-soft); border-radius:12px; padding:14px 16px; margin-top:12px}
.answer p{margin:0 0 8px; font-weight:700}
.answer ul{margin:0; padding-left:20px}
.answer li{margin:6px 0}
.badge{margin-top:12px; padding:10px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn-ink); border:1.5px solid var(--warn-line); font-size:.95rem}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
.btn{font:inherit; font-weight:700; font-size:1rem; text-decoration:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:10px 18px; border-radius:12px; border:2px solid var(--accent); background:#fff; color:var(--accent)}
.btn.primary{background:var(--accent); color:#fff}
.listen{display:none}
body.audio-on .listen{display:inline-flex}
.src{margin:12px 0 0; font-size:.85rem; color:var(--muted); word-break:break-all}
.src a{color:var(--muted)}

/* demo */
.demo{display:none; margin-top:14px}
.demo.show{display:block}
.frame{border:2px solid #B4C2CD; border-radius:16px; overflow:hidden; background:#fff}
.urlbar{display:flex; gap:8px; align-items:center; background:#E8EDF1; padding:8px 10px}
.urlpill{flex:1; min-width:0; background:#fff; border-radius:999px; padding:6px 14px; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.screen{min-height:262px; padding:12px 14px; position:relative}
.site-head{display:flex; justify-content:space-between; align-items:center; background:#DCE4EA; border-radius:8px; padding:6px 10px; font-size:.78rem; color:var(--muted)}
.sbox{margin-top:14px; border:2px solid #9DAEBC; border-radius:12px; padding:10px 14px; min-height:50px; display:flex; align-items:center; background:#fff; font-size:1.02rem}
.sbox.hl{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.ph{color:#7B8B99}
.caret{display:inline-block; width:2px; height:1.2em; background:var(--ink); margin-left:2px}
.sk{height:10px; border-radius:6px; background:#E2E8ED; margin:9px 0}
.result{border:2px solid #E0E6EB; border-radius:10px; padding:8px 12px; margin-top:10px; position:relative}
.result.target{border-color:var(--accent); background:var(--accent-soft)}
.tap{position:absolute; right:10px; bottom:4px; font-size:1.6rem}
.pg-title{margin:16px 0 8px; font-size:1.05rem; line-height:1.3}
.found{display:inline-block; padding:6px 12px; border-radius:8px; background:var(--accent); color:#fff; font-size:.88rem; font-weight:700; margin-bottom:6px}
.fakebtn{margin-top:14px; display:inline-block; padding:12px 18px; border-radius:10px; background:#fff; border:2px solid var(--accent); color:var(--accent); font-weight:700; box-shadow:0 0 0 4px var(--accent-soft)}
.hint{color:var(--muted); text-align:center; margin-top:70px}
.caption{background:var(--accent-soft); padding:12px 14px; font-weight:700; min-height:5.2em}
.dctrl{display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px; border-top:2px solid #E0E6EB; background:#fff}
.dctrl .btn{min-height:46px; padding:8px 14px}
.dnote{font-size:.82rem; color:var(--muted); margin:8px 2px 0}

/* settings sheet */
.sheet{position:fixed; inset:0; background:rgba(12,22,32,.5); display:none; align-items:flex-end; justify-content:center; z-index:30}
.sheet.open{display:flex}
.sheet-card{background:#fff; width:min(540px,100%); border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0)); max-height:90vh; overflow:auto}
@media(min-width:620px){.sheet{align-items:center}.sheet-card{border-radius:20px}}
.sheet h2{margin:0 0 10px; font-size:1.35rem}
.row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0; border-top:1.5px solid var(--line)}
.row small{display:block; color:var(--muted); font-size:.88rem; line-height:1.4}
.switch{flex:none; width:68px; height:38px; border-radius:999px; border:none; background:#8D9DAA; position:relative; cursor:pointer}
.switch::after{content:""; position:absolute; top:4px; left:4px; width:30px; height:30px; border-radius:50%; background:#fff; transition:left .15s}
.switch[aria-checked="true"]{background:var(--seniors)}
.switch[aria-checked="true"]::after{left:34px}
.seg{display:flex; gap:8px}
.seg button{font:inherit; font-weight:700; min-height:48px; padding:8px 16px; border-radius:12px; border:2px solid var(--seniors); background:#fff; color:var(--seniors); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seniors); color:#fff}
.sheet .btn{border-color:var(--seniors); color:var(--seniors)}
.sheet .btn.primary{background:var(--seniors); color:#fff}

/* speaking pill + toast */
.pill{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0)); background:var(--ink); color:#fff; border-radius:999px; padding:8px 8px 8px 18px; display:none; align-items:center; gap:12px; z-index:20; font-weight:700}
.pill.on{display:flex}
.pill button{font:inherit; font-weight:700; min-height:44px; padding:6px 16px; border-radius:999px; border:none; background:#fff; color:var(--ink); cursor:pointer}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0)); background:#fff; border:2px solid var(--ink); border-radius:12px; padding:10px 16px; display:none; z-index:40; max-width:90%; font-size:.95rem}
.toast.on{display:block}

footer{margin-top:26px; padding-top:16px; border-top:2px solid var(--line); color:var(--muted); font-size:.9rem}
footer p{margin:0 0 8px}

/* language + size options */
html[lang="zh-Hans"] body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif}
html[lang="ta"] body{font-family:"Nirmala UI","Noto Sans Tamil","Latha","Tamil Sangam MN",system-ui,sans-serif; line-height:1.8}
html[lang="ms"] body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.opts{display:flex; flex-wrap:wrap; gap:12px 22px; margin:0 0 14px}
.opt{display:flex; flex-direction:column; gap:4px}
.optlbl{font-weight:700; font-size:.88rem; color:var(--muted)}
.seg2{display:flex; flex-wrap:wrap; gap:6px}
.seg2 button{font:inherit; font-weight:700; font-size:.95rem; min-height:48px; min-width:48px; padding:6px 14px; border-radius:12px; border:2px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink); color:#fff}
/* Everyday Compass look: navy header panel, teal / navy topic panels, white cards with provider + domain */
.skip{position:absolute; left:-999px; top:8px; background:#fff; color:var(--ink); padding:12px 18px; border-radius:10px; font-weight:700; z-index:50}
.skip:focus{left:12px}
.prov{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 2px; font-size:.92rem; color:var(--muted)}
.pdot{width:10px; height:10px; border-radius:50%; background:var(--accent)}
.prov strong{color:var(--ink)}
.pdom{background:var(--accent-soft); color:var(--accent); padding:2px 10px; border-radius:999px; font-weight:700; font-size:.85rem}
button.sbox,button.result,button.fakebtn{font:inherit; color:inherit; text-align:left; cursor:pointer}
button.sbox,button.result{width:100%; display:block}
button.result{background:#fff}
button.result.target{background:var(--accent-soft)}
button.sbox{display:flex}
button.fakebtn{background:#fff}
.sk{display:block}
.caption{white-space:pre-line}
.caption.wait{box-shadow:inset 0 0 0 3px var(--accent)}
.seg{flex-wrap:wrap}
.row.stack{flex-direction:column; align-items:stretch}
/* Everyday Compass look: white header bar, periwinkle page, green eyebrow, blue accent headline, pill controls, white cards with lavender strip */
body{background:var(--bg)}
.bar{background:#fff; border-bottom:2px solid var(--line); position:sticky; top:0; z-index:15; padding-top:env(safe-area-inset-top,0)}
.bar-in{max-width:780px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{flex:none; width:42px; height:42px; border-radius:12px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:800; font-size:1.2rem}
.bname strong{display:block; line-height:1.15; font-size:1.05rem}
.bname small{display:block; color:var(--muted); font-size:.8rem; line-height:1.25}
.gear{flex-direction:row; display:inline-flex; align-items:center; gap:8px; padding:6px 18px; border-radius:999px; min-width:0}
.gear span{display:inline; font-size:.95rem; line-height:1}
.gear b{font-size:1.1rem}
.hero{padding:22px 0 6px}
.eyebrow{margin:0 0 8px; color:var(--green); font-weight:800; font-size:.85rem; letter-spacing:.16em; text-transform:uppercase}
html[lang="zh-Hans"] .eyebrow, html[lang="ta"] .eyebrow{letter-spacing:.04em; text-transform:none; font-size:.95rem}
.hero h1{font-size:clamp(2rem,8vw,2.8rem); line-height:1.1; letter-spacing:-.025em; font-weight:800; margin:0 0 10px}
.acc{color:var(--blue)}
.hero .sub{color:var(--muted); font-size:1.02rem}
.hero .opts{margin-top:16px}
.seg2 button{border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px}
.seg2 button[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
.btn{border-radius:999px}
.tab{border-radius:18px}
.item{border:2px solid var(--line); border-top:6px solid var(--strip); border-radius:22px; box-shadow:0 8px 24px rgba(45,74,192,.08)}
.item.open{border-color:var(--accent); border-top-color:var(--accent)}
.switch[aria-checked="true"]{background:var(--blue)}
.seg button{border-color:var(--blue); color:var(--blue); border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--blue); color:#fff}
.sheet .btn{border-color:var(--blue); color:var(--blue)}
.sheet .btn.primary{background:var(--blue); color:#fff}
@media (forced-colors:active){.item,.btn,.tab,.kw,.seg button,.seg2 button,.frame{border:2px solid CanvasText}}
@media (prefers-reduced-motion:no-preference){
  .sbox.hl{animation:pulse 1.6s ease-in-out infinite}
  .caret{animation:blink 1s steps(1) infinite}
  .tap{animation:nudge 1.2s ease-in-out infinite}
}
@keyframes pulse{50%{box-shadow:0 0 0 9px var(--accent-soft)}}
@keyframes blink{50%{opacity:0}}
@keyframes nudge{50%{transform:translateY(-5px)}}
@media(max-width:420px){body{font-size:1.06rem}.tab strong{font-size:1.05rem}}
@media(max-width:520px){html[data-size="3"] .tabs{grid-template-columns:1fr}}
</style>
</head>
<body data-cat="seniors">
<a class="skip" href="#list" data-i18n="skip">Skip to the questions</a>
<header class="bar"><div class="bar-in">
  <div class="brand"><span class="mark" aria-hidden="true">↗</span><span class="bname"><strong data-i18n="brand">CPF Guide</strong><small data-i18n="brandSub">Plain answers</small></span></div>
  <button class="gear" id="openSettings" aria-haspopup="dialog" aria-label="Open settings"><b aria-hidden="true">⚙</b><span data-i18n="settingsBtn">Settings</span></button>

<div class="wrap">
  <section class="hero">

    <p class="sub" data-i18n="sub">Summaries from CPF Board pages, checked 8 October 2026.</p>
    <div class="opts">
    <div class="opt" role="group" aria-labelledby="langLbl">
      <span class="optlbl" id="langLbl" data-i18n="langLbl">Language</span>
      <div class="seg2" id="langSeg">
        <button data-lang="en" aria-pressed="true">English</button>
        <button data-lang="zh" aria-pressed="false" lang="zh-Hans">中文</button>

      </div>

        <button data-size="1" aria-pressed="true" style="font-size:1rem">A</button>

  </section>

  <div class="tabs" role="tablist" aria-label="Topics">

  <p class="panel-intro" id="intro"></p>
  <div id="list"></div>

</div>

<!-- settings -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <h2 id="sheetTitle" data-i18n="settingsTitle">Settings</h2>
    <div class="row">
      <div><strong id="audioLbl" data-i18n="audioLbl">Read answers aloud</strong><small data-i18n="audioDesc"></small></div>

        <button data-gender="female" aria-pressed="false" data-i18n="voiceFemale">Female</button>
        <button data-gender="male" aria-pressed="false" data-i18n="voiceMale">Male</button>
      </div>
    </div>
    <div class="row stack">
      <div><strong data-i18n="timeLbl">Time on each demo screen</strong><small data-i18n="timeDesc"></small></div>
      <div class="seg" id="timeSeg" role="group">
        <button data-time="auto" aria-pressed="true">Auto</button>
        <button data-time="3" aria-pressed="false">3 sec</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------- content ---------- */
const DATA = {
  seniors: {
    label: "Seniors: CPF LIFE",
    intro: "<b>Seniors: CPF LIFE.</b> Twenty questions people ask about monthly payouts for life. Tap a question to open it.",
    items: [
      { id:"s1", q:"When will I start getting payouts, and can I wait?",
        kw:["CPF LIFE payout age","when start CPF LIFE","defer payout 70"],
        title:"When can I start receiving my CPF LIFE payouts?",
        sum:"You can start CPF LIFE payouts at any age from 65 to 70. If you wait, your monthly payout rises by up to 7% for each year you defer.",
        pts:["Starting at 70 can lift your payout by up to about 35% compared with starting at 65.","If you give no instruction, payouts start automatically at 70. You cannot defer past 70.","CPF writes to you about three months before your 65th birthday to explain your choices.","To defer, or to restart after deferring, use the “Plan my monthly payouts” service."],
        url:"https://www.cpf.gov.sg/service/article/when-can-i-start-receiving-my-cpf-life-payouts",
        links:[{t:"Should you defer? (CPF article)",u:"https://www.cpf.gov.sg/member/infohub/educational-resources/should-you-defer-your-cpf-life-payouts"}],
        login:"You will need your Singpass to change when your payouts start." },
      { id:"s2", q:"How much will I get every month?",
        kw:["CPF LIFE payout estimator","how much per month","Standard vs Basic"],
        title:"CPF LIFE payouts: see your monthly amount",
        sum:"Your monthly payout depends on how much is in your Retirement Account, the plan you choose, the CPF interest rate, your sex, and your age when you start.",
        pts:["CPF has an online estimator at cpf.gov.sg/payout that shows the monthly amount under each plan.","CPF’s own example (August 2026): a 55-year-old man with SGD$220,400 in his Retirement Account on the Standard Plan gets about SGD$600 more a month by starting at 70 instead of 65.","Topping up your Retirement Account or deferring both raise the estimate."],
        url:"https://www.cpf.gov.sg/payout",
        links:[{t:"How the Retirement Sum affects payouts",u:"https://www.cpf.gov.sg/member/infohub/educational-resources/how-the-cpf-retirement-sum-affects-your-payouts"}],
        login:"Log in with Singpass to use your own Retirement Account balance in the estimate." },
      { id:"s3", q:"If I pass away early, does my family get the money?",
        kw:["CPF LIFE death benefit","CPF nomination","balance after death"],
        title:"What happens to my savings used for CPF LIFE when I pass away?",
        sum:"Yes. Any remaining CPF LIFE premium balance, plus your other remaining CPF savings, is paid to your beneficiaries.",
        pts:["The premium balance is what was taken from your Retirement Account when you joined, minus the payouts you have already received.","It is paid out according to your CPF nomination, so make a nomination.","A CPF nomination does not cover property bought with CPF or CPF Investment Scheme investments.","You can see your premium balance in the “Monthly payouts” section of your Retirement Dashboard."],
        url:"https://www.cpf.gov.sg/service/article/what-happens-to-my-savings-used-for-cpf-life-when-i-pass-away-will-it-go-to-my-beneficiaries",
        links:[{t:"What a CPF nomination covers",u:"https://www.cpf.gov.sg/service/article/what-happens-to-my-cpf-savings-if-i-had-made-a-cpf-nomination"}],
        login:"Log in with Singpass to see your own premium balance." },
      { id:"s4", q:"Which plan should I pick: Standard, Basic or Escalating?",
        kw:["CPF LIFE plans compare","Escalating plan 2%","Standard plan"],
        title:"What are the CPF LIFE plans available and which is the right plan for me?",
        sum:"There are three plans. Standard gives steady payouts that start higher. Escalating starts lower and grows by 2% every year. Basic gives lower payouts that fall further later.",
        pts:["Basic is an older plan from 2009. About 10 to 20% of your savings becomes the premium, and payouts get lower once your combined CPF balances drop below SGD$60,000. CPF says many members find Standard or Escalating suits them better.","On every plan you are paid for life, your premium earns risk-free CPF interest, and any leftover premium goes to your beneficiaries.","If you give no instruction by 70, you are placed on the Standard Plan."],
        url:"https://www.cpf.gov.sg/service/article/what-are-the-cpf-life-plans-available-and-which-is-the-right-plan-for-me",
        links:[{t:"CPF LIFE brochure (PDF)",u:"https://www.cpf.gov.sg/content/dam/web/member/retirement/documents/OnlineBrochureEnglish.pdf"}] },
      { id:"s5", q:"Can I take my money out in one lump sum?",
        kw:["CPF withdrawal 55","withdraw SGD$5,000","withdraw excess RA"],
        title:"How much CPF savings can I withdraw?",
        sum:"Only part of it. From 55 you can withdraw SGD$5,000, or any OA and SA savings above your Full Retirement Sum. The rest is kept to pay your monthly payouts.",
        pts:["If you were born in 1958 or later, you can withdraw up to 20% of your retirement savings at 65. This includes the SGD$5,000.","Property owners whose lease lasts to at least 95 can withdraw Retirement Account savings above the Basic Retirement Sum.","Cash top-ups, CPF transfers and government grants cannot be withdrawn, because they are meant to raise your payouts."],
        url:"https://cpf.gov.sg/member/faq/retirement-income/retirement-withdrawals/how-much-cpf-savings-can-i-withdraw",
        links:[{t:"Can you withdraw your CPF at 55?",u:"https://cpf.gov.sg/member/infohub/educational-resources/can-you-withdraw-your-cpf-at-55"}],
        login:"Your Retirement Dashboard shows the exact amount you can withdraw. You need Singpass." },
      { id:"s6", q:"What are BRS, FRS and ERS, and which should I set aside?",
        kw:["Basic Retirement Sum","Full Retirement Sum","Enhanced Retirement Sum"],
        title:"What are the Basic, Full and Enhanced Retirement Sums applicable to me?",
        sum:"These are three levels of savings to set aside at 55. For those turning 55 in 2026: Basic SGD$110,200, Full SGD$220,400, Enhanced SGD$440,800.",
        pts:["The Full Retirement Sum is double the Basic, and is the default amount to set aside.","The Enhanced Retirement Sum is four times the Basic (since 2025). It is the most you can top up to for higher payouts.","Your Basic and Full amounts are fixed for life by the year you turn 55. The Enhanced amount rises each year (SGD$456,400 in 2027).","For 2027 the Basic is SGD$114,100 and the Full is SGD$228,200."],
        url:"https://www.cpf.gov.sg/member/infohub/educational-resources/how-the-cpf-retirement-sum-affects-your-payouts",
        links:[{t:"Retirement sums by year (Ask.gov.sg, from CPF)",u:"https://ask.gov.sg/cpf/questions/cltr1sd6g0152bykzc716a9w3"}] },
      { id:"s7", q:"Can I use my house to meet the Retirement Sum?",
        kw:["property pledge","CPF housing charge","pledge house retirement sum"],
        title:"Can you withdraw your CPF at 55?",
        sum:"Yes, if you own a property with a lease lasting to at least age 95. You can pledge it and set aside only the Basic Retirement Sum, then withdraw savings above that.",
        pts:["The trade-off is a smaller Retirement Account, so your monthly CPF LIFE payouts will be lower.","When you sell the property, you must refund the proceeds to your CPF and restore your Retirement Account up to the Full Retirement Sum."],
        url:"https://cpf.gov.sg/member/infohub/educational-resources/can-you-withdraw-your-cpf-at-55",
        links:[{t:"Quick facts on housing and CPF LIFE",u:"https://www.cpf.gov.sg/member/infohub/cpf-clarifies/clarifications/quick-facts-on-housing-withdrawals-and-cpf-life"}] },
      { id:"s8", q:"Is CPF LIFE better than a private annuity?",
        kw:["CPF LIFE vs annuity","is CPF LIFE worth it","CPF LIFE interest"],
        title:"How to use CPF LIFE as the cornerstone of your retirement planning",
        sum:"CPF compared its Standard Plan with three popular private retirement-income plans. It found CPF LIFE’s effective interest is higher in almost all cases after counting payouts and bequests.",
        pts:["This is CPF’s own comparison, so also look at quotes from insurers for your age and amount.","CPF LIFE pays for life, and your premium earns CPF interest of up to 6% a year, risk-free.","CPF LIFE works by pooling risk, like insurance."],
        url:"https://cpf.gov.sg/BenefitsCPFLIFETG",
        links:[{t:"CPF LIFE brochure (PDF)",u:"https://www.cpf.gov.sg/content/dam/web/member/retirement/documents/OnlineBrochureEnglish.pdf"}] },
      { id:"s9", q:"Can I change my plan or top up after joining?",
        kw:["change CPF LIFE plan","top up RA","cash top-up"],
        title:"Plan my monthly payouts",
        sum:"You can use the “Plan my monthly payouts” service to change your plan, defer or restart your payouts. Topping up your Retirement Account raises your payouts.",
        pts:["If you change plan, CPF takes your whole Retirement Account savings, including the premium refunded from your old plan, as the premium for the new plan.","You can top up your Retirement Account, in cash or by transfer, up to the Enhanced Retirement Sum.","Top-up money is meant for retirement and is paid out as monthly payouts. If your payouts have already started, check the service page for what applies to you."],
        url:"https://www.cpf.gov.sg/member/tnc/planmymonthlypayouts",
        links:[{t:"How to defer or restart payouts",u:"https://www.cpf.gov.sg/service/article/how-do-I-defer-or-restart-my-cpf-life-monthly-payouts"}],
        login:"You will need your Singpass to make changes." },
      { id:"s10", q:"Will my payouts keep up with rising prices?",
        kw:["CPF LIFE inflation","Escalating plan 2%","payouts increase"],
        title:"What are the CPF LIFE plans available and which is the right plan for me?",
        sum:"The Escalating Plan is CPF’s answer to rising prices. It starts lower, then grows by 2% every year for life.",
        pts:["The Standard Plan pays a steady amount. It starts higher than Escalating, but is lower in the later years.","CPF suggests Escalating if you worry about the cost of living, and Standard if you expect to spend less as you grow older.","Waiting until 70 to start also lifts your payout, by up to 7% for each year you defer."],
        url:"https://www.cpf.gov.sg/service/article/what-are-the-cpf-life-plans-available-and-which-is-the-right-plan-for-me",
        links:[{t:"What is the CPF LIFE payout age?",u:"https://www.cpf.gov.sg/member/infohub/educational-resources/what-is-the-cpf-life-payout-age"}] }
    ]
  },
  adults: {
    label: "Adults: Grow CPF",
    intro: "<b>Adults: Grow CPF.</b> Twenty practical ways people build up their CPF. Tap a tip to open it.",
    items: [
      { id:"a1", q:"Top up my Special Account (or Retirement Account) to earn more",
        kw:["CPF SA top up","cash top-up relief","how to top up CPF"],

        pts:["Your Special Account closes at 55, so from then on top-ups go to your Retirement Account.","You can top up with cash by PayNow, or with small regular amounts by GIRO, at cpf.gov.sg/topup.","Top-ups are for retirement. They are paid out as monthly payouts later, not as cash for other uses."],
        url:"https://www.cpf.gov.sg/member/growing-your-savings/saving-more-with-cpf/top-up-to-enjoy-higher-retirement-payouts",
        links:[{t:"CPF interest rates",u:"https://www.cpf.gov.sg/service/article/what-are-the-cpf-interest-rates"}],
        login:"You will need your Singpass to make a top-up." },
      { id:"a2", q:"Get tax relief when I top up",
        kw:["CPF tax relief","RSTU","cash top-up relief"],
        title:"How much tax relief can I enjoy when I make cash top-ups?",
        sum:"You can get up to SGD$8,000 of tax relief a year for cash top-ups to your own SA or RA, and another SGD$8,000 for top-ups to your loved ones. That is up to SGD$16,000 a year.",
        pts:["Relief only applies to cash top-ups, up to the current year’s Full Retirement Sum.","The SGD$8,000 for your own account is shared with top-ups to your own MediSave Account.","Since 1 January 2025, cash top-ups that earn the MRSS matching grant no longer get tax relief."],
        url:"https://www.cpf.gov.sg/service/article/how-much-tax-relief-can-i-enjoy-when-i-make-cash-top-ups",
        links:[{t:"IRAS: CPF Cash Top-up Relief",u:"https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/tax-reliefs-rebates-and-deductions/tax-reliefs/central-provident-fund-(cpf)-cash-top-up-relief"}] },
      { id:"a3", q:"Top up my parents’ or family’s CPF",
        kw:["top up parents CPF","Retirement Sum Topping-Up Scheme","top up for family"],
        title:"How much tax relief can I enjoy when I make cash top-ups?",
        sum:"You can top up the SA or RA of family members, and you get up to SGD$8,000 of tax relief a year for it, on top of the SGD$8,000 for your own account.",
        pts:["The tax relief goes to you, the person giving the top-up.","Relief counts only up to the Full Retirement Sum of the person you top up.","Top-ups build the recipient’s retirement savings and are paid to them as monthly payouts in retirement.","If the recipient passes away, remaining top-ups go to their CPF nominees."],
        url:"https://www.cpf.gov.sg/service/article/how-much-tax-relief-can-i-enjoy-when-i-make-cash-top-ups",
        links:[{t:"Top up to enjoy higher payouts",u:"https://www.cpf.gov.sg/member/growing-your-savings/saving-more-with-cpf/top-up-to-enjoy-higher-retirement-payouts"}],
        login:"You will need your Singpass to make a top-up." },
      { id:"a4", q:"Earn the extra interest on my first SGD$60,000",
        kw:["CPF extra interest","CPF 6% for seniors","CPF interest rates"],
        title:"What are the CPF interest rates?",
        sum:"The Government pays extra interest on the first SGD$60,000 of your combined CPF balances. Below 55, it is an extra 1%. From 55, it is an extra 2% on the first SGD$30,000 and an extra 1% on the next SGD$30,000.",
        pts:["Only up to SGD$20,000 from your Ordinary Account counts towards this.","Extra interest earned on OA savings is paid into your SA or RA.","Together with the 4% base rate, CPF shows effective rates of up to 5% below 55, and up to 6% on the first SGD$30,000 from 55.","The rates on the CPF page I checked were for 1 July to 30 September 2026. They are reviewed every quarter."],
        url:"https://www.cpf.gov.sg/service/article/what-are-the-cpf-interest-rates",
        links:[{t:"Historical rates (PDF)",u:"https://www.cpf.gov.sg/content/dam/web/member/faq/documents/InterestRate.pdf"}] },
      { id:"a5", q:"Move savings from my Ordinary Account to earn 4%",
        kw:["OA to SA transfer","transfer OA to RA","CPF transfer irreversible"],
        title:"Simple steps to make a CPF transfer from your OA to SA",
        sum:"Moving money from your Ordinary Account (2.5%) to your Special or Retirement Account (4%) earns more interest. But the transfer is immediate and cannot be reversed.",
        pts:["Under 55, you transfer OA to SA. From 55 your SA closes, so you transfer OA to your Retirement Account, up to the Enhanced Retirement Sum.","Keep enough OA savings for housing or other needs first, because you cannot move the money back.","On the website: log in with Singpass, choose CPF transfer, enter the amount, then review and confirm."],
        url:"https://www.cpf.gov.sg/member/infohub/educational-resources/simple-steps-to-make-a-cpf-transfer-from-your-oa-to-sa",
        links:[{t:"After 55: transfer to your RA",u:"https://cpf.gov.sg/member/faq/retirement-income/general-information-on-retirement/once-i-meet-my-full-retirement-sum--my-special-account-savings-w"}],
        login:"You will need your Singpass to make a transfer." },
      { id:"a6", q:"Reach the Full Retirement Sum early",
        kw:["how to reach FRS","FRS top up","Full Retirement Sum 2026"],
        title:"How the CPF Retirement Sum affects your payouts",
        sum:"The Full Retirement Sum is the default amount to set aside for retirement. For those turning 55 in 2026 it is SGD$220,400, and it stays the same for life once you turn 55.",
        pts:["At 55, CPF opens your Retirement Account and moves your Special Account savings first, then Ordinary Account savings, up to the Full Retirement Sum.","If you are short, cash top-ups and OA transfers can close the gap before payouts begin.","Once you have set it aside, you can withdraw OA and SA savings above it.","A property pledge lets you set aside only the Basic Retirement Sum (SGD$110,200 for 2026), but your payouts will be lower."],
        url:"https://www.cpf.gov.sg/member/infohub/educational-resources/how-the-cpf-retirement-sum-affects-your-payouts",
        links:[{t:"Retirement sums by year (Ask.gov.sg, from CPF)",u:"https://ask.gov.sg/cpf/questions/cltr1sd6g0152bykzc716a9w3"}] },
      { id:"a7", q:"Delay my CPF LIFE payouts for a higher monthly amount",
        kw:["defer CPF LIFE","higher payout later","CPF LIFE age 70"],
        title:"Should you defer your CPF LIFE payouts?",
        sum:"You can start between 65 and 70. For each year you wait, your monthly payout rises by up to 7%, which can add up to a 35% increase by 70.",
        pts:["CPF’s example (August 2026): a 55-year-old man with SGD$220,400 in his Retirement Account on the Standard Plan gets about SGD$600 more a month starting at 70 than at 65.","Payouts begin automatically at 70, even if you do nothing.","Use the “Plan my monthly payouts” service to defer or restart."],
        url:"https://www.cpf.gov.sg/member/infohub/educational-resources/should-you-defer-your-cpf-life-payouts",
        links:[{t:"When can I start receiving my payouts?",u:"https://www.cpf.gov.sg/service/article/when-can-i-start-receiving-my-cpf-life-payouts"}],
        login:"You will need your Singpass to change your start age." },
      { id:"a8", q:"Top up to the Enhanced Retirement Sum",
        kw:["ERS top up","increase CPF LIFE payout","Enhanced Retirement Sum"],
        title:"Once I meet my Full Retirement Sum, how do I earn higher interest?",
        sum:"From age 55 you can top up your Retirement Account up to the Enhanced Retirement Sum for higher monthly payouts. It is SGD$440,800 in 2026 and SGD$456,400 in 2027.",
        pts:["Since 2025 the Enhanced Retirement Sum is four times the Basic Retirement Sum (it was SGD$308,700 in 2024, then SGD$426,000 in 2025).","The Retirement Account pays the same interest as the Special Account.","Top-ups and transfers are irreversible. After 55 you cannot take them out for housing, investing or other needs."],
        url:"https://cpf.gov.sg/member/faq/retirement-income/general-information-on-retirement/once-i-meet-my-full-retirement-sum--my-special-account-savings-w",
        links:[{t:"Retirement sums by year (Ask.gov.sg, from CPF)",u:"https://ask.gov.sg/cpf/questions/cltr1sd6g0152bykzc716a9w3"}],
        login:"You will need your Singpass to top up." },
      { id:"a9", q:"Keep working or earn more",
        kw:["CPF contribution rates by age","CPF for senior workers","CPF salary ceiling"],
        title:"CPF contribution changes from 1 January 2026",
        sum:"From 1 January 2026, total CPF contributions are 37% of wages for age 55 and below, 34% above 55 to 60, 25% above 60 to 65, 16.5% above 65 to 70, and 12.5% above 70.",
        pts:["Those aged above 55 to 65 saw their rates rise in 2026. The increase goes to the Retirement Account until the Full Retirement Sum is met, then to the Ordinary Account.","Age 55 and below: employer 17% and you 20%. Above 55 to 60: employer 16% and you 18%.","The monthly wage ceiling for CPF rose to SGD$8,000 in January 2026.","These rates apply to wages above SGD$750 a month."],
        url:"https://www.cpf.gov.sg/conrate2023",
        links:[{t:"Ask.gov.sg: senior worker rates",u:"https://ask.gov.sg/cpf/questions/cmjxi9x87008bdxj6htagerge"}] },
      { id:"a10", q:"Get the Government’s matching grant (MRSS)",

        title:"Matching grant for seniors who top up",
        sum:"If you qualify, the Government matches your cash top-ups to your Retirement Account dollar for dollar, up to SGD$2,000 a year, with a SGD$20,000 lifetime limit.",
        pts:["It is for Singapore Citizens aged 55 and above with lower Retirement Account savings. The age cap of 70 was removed in 2025.","CPF checks your eligibility every year, so you do not need to apply. Check it on your Retirement Dashboard or at cpf.gov.sg/checkmrss.","Make your top-up by 31 December. The grant is credited at the start of the following year.","Top-ups that earn the match do not qualify for tax relief."],
        url:"https://www.cpf.gov.sg/member/growing-your-savings/saving-more-with-cpf/matching-grant-for-seniors-who-top-up",
        links:[{t:"MRSS main page",u:"https://cpf.gov.sg/MRSS"}],

  { id:"s11", q:"Am I automatically in CPF LIFE, and who can join?",

  { id:"s12", q:"What if I am not on CPF LIFE?",

    title:"How long will my monthly payouts last if I am not on CPF LIFE?",

    login:"Log in with Singpass to start your payouts or join CPF LIFE." },
  { id:"s13", q:"When and how will I be paid each month?",

    login:"Log in with Singpass to check or update your bank account details." },
  { id:"s14", q:"Can my payouts go up or down?",
    kw:["CPF LIFE payout adjustment","CPF LIFE guaranteed","change CPF LIFE plan 30 days"],
    title:"Plan my monthly payouts",
    sum:"CPF LIFE pays you for life, but payouts are not fixed for ever. CPF says monthly payouts may be adjusted every year for factors such as interest rates and how long members are living.",
    pts:["CPF says payouts are designed to be stable, and any adjustments are expected to be small and gradual.","After you get your policy letter, you have 30 days to change or cancel your plan.","Using more of your CPF savings to increase your payouts is a decision you cannot undo."],
    url:"https://www.cpf.gov.sg/member/tnc/planmymonthlypayouts",
    links:[{t:"Are CPF LIFE payouts guaranteed? (Ask.gov.sg, from CPF)",u:"https://ask.gov.sg/cpf/questions/cm0f52kyk00x5pz7a84o2tdus"}],
    login:"You will need your Singpass to make changes." },
  { id:"s15", q:"If I add money to my Retirement Account after payouts start, do my payouts go up?",
    kw:["top up RA after payouts","CPF LIFE premium increase","Additional Monthly Payout AMP"],
    title:"Will my AMP be converted to higher CPF LIFE monthly payouts automatically?",
    sum:"Generally yes. Since November 2021, new money coming into your Retirement Account is used automatically to raise your CPF LIFE premium, so you receive higher payouts for life.",
    pts:["On the Basic Plan, this happens when the revised monthly payout rises by at least SGD$10. CPF will tell you the new amount.","If you get an Additional Monthly Payout (AMP) from your Retirement Account, it is not part of CPF LIFE and stops when that balance runs out.","To avoid a sudden drop in income when AMP ends, you can ask CPF to use your remaining Retirement Account savings to raise your CPF LIFE premium."],
    url:"https://www.cpf.gov.sg/service/article/i-am-currently-receiving-additional-monthly-payout-amp-will-my-amp-be-converted-to-higher-cpf-life-monthly-payouts-automatically",
    links:[{t:"How the CPF LIFE Basic Plan works",u:"https://www.cpf.gov.sg/service/article/how-does-the-cpf-life-basic-plan-work"}] },
  { id:"s16", q:"Do I pay tax on my CPF LIFE payouts?",
    kw:["CPF LIFE tax","is CPF payout taxable","annuity tax Singapore"],
    title:"Annuity (recurring annual payments)",
    sum:"No. IRAS says annuities received in Singapore are generally not taxable, and it names CPF LIFE monthly payouts as an example.",
    pts:["Some annuities are taxable, such as those from a business or partnership, SRS withdrawals, or a policy bought by your employer in place of a pension. CPF LIFE is not one of them.","If you also have other income, check with IRAS for your own situation."],
    url:"https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/what-is-taxable-what-is-not/annuity-(recurring-annual-payments)",
    site:"iras.gov.sg", prov:"IRAS", links:[] },
  { id:"s17", q:"Can I opt out of CPF LIFE and take my savings out?",
    kw:["opt out CPF LIFE","exempt from CPF LIFE","withdraw all retirement savings"],
    title:"Can I opt out of receiving CPF monthly payouts and withdraw all my retirement savings?",
    sum:"Yes, if you have other sources of lifelong income. CPF also says you can be exempted from CPF LIFE if you have a pension or private annuity that pays the same or higher monthly amount.",
    pts:["The CPF page says you can opt out of monthly payouts and withdraw all your retirement savings if you have other sources of lifelong income.","The CPF LIFE page says you can be exempted if your pension or private annuity guarantees monthly payouts that are the same as or higher than CPF LIFE.","CPF also suggests considering CPF LIFE on top of your other retirement income."],
    url:"https://www.cpf.gov.sg/service/article/can-i-opt-out-of-receiving-cpf-monthly-payouts-and-withdraw-all-my-retirement-savings",
    links:[{t:"CPF LIFE main page",u:"https://www.cpf.gov.sg/cpflife"},{t:"3 things you may not know about CPF LIFE",u:"https://www.cpf.gov.sg/member/infohub/educational-resources/3-things-you-may-not-know-about-cpf-life"}] },
  { id:"s18", q:"Why are payouts different for men and women?",
    kw:["CPF LIFE men women payout","how CPF LIFE payout calculated","CPF LIFE life expectancy"],
    title:"How are the CPF LIFE payouts calculated?",
    sum:"CPF LIFE pays for life, so a longer life expectancy means a lower monthly payout. Women live longer on average, so for the same savings, men receive higher payouts than women.",
    pts:["Your payout is worked out from four things: your Retirement Account balance when you join, when you start (up to 7% more for each year you defer), CPF interest rates, and life expectancy.","The interest used has a floor of 4%, plus up to 2% extra interest on the first SGD$60,000 of your combined CPF balances."],
    url:"https://www.cpf.gov.sg/service/article/how-are-the-cpf-life-payouts-calculated",
    links:[] },
  { id:"s19", q:"Why does the Retirement Sum go up every year?",
    kw:["why retirement sum increase","CPF retirement sum 2027","Full Retirement Sum increase"],
    title:"Why are the retirement sums increasing yearly?",
    sum:"CPF gives three reasons: prices rise, people live longer, and living standards improve, so more savings are needed to keep the same lifestyle in retirement.",
    pts:["If you are already 55, the yearly increase does not affect you. Your Basic and Full Retirement Sums are fixed for life by the year you turn 55.","CPF's example: the Full Retirement Sum was SGD$30,000 in 1987. If it had stayed there, it would give only about SGD$300 a month today."],
    url:"https://www.cpf.gov.sg/service/article/why-are-the-retirement-sums-increasing-yearly",
    links:[{t:"How the Retirement Sum affects payouts",u:"https://www.cpf.gov.sg/member/infohub/educational-resources/how-the-cpf-retirement-sum-affects-your-payouts"}] },
  { id:"s20", q:"Is my money in CPF LIFE safe?",
    kw:["is CPF LIFE safe","CPF LIFE guaranteed","CPF LIFE capital guaranteed"],
    title:"What are the features of CPF LIFE?",
    sum:"CPF LIFE savings are guaranteed by the Singapore Government. CPF also guarantees that your total payouts plus anything paid to your beneficiaries will be at least your CPF LIFE premium.",
    pts:["Your premium earns CPF interest of up to 6% a year, risk free, and this is built into your payouts.","CPF LIFE is an insurance scheme, not an investment. It is non-profit and run by CPF Board.","It works by pooling risk: the interest on remaining premiums is pooled so that all members are paid for as long as they live."],
    url:"https://www.cpf.gov.sg/service/article/what-are-the-features-of-cpf-life",
    links:[{t:"Key facts of CPF LIFE",u:"https://www.cpf.gov.sg/member/infohub/educational-resources/key-facts-of-cpf-life-you-should-know"}] }
);

DATA.adults.items.push(
  { id:"a11", q:"Top up my MediSave Account",
    kw:["top up MediSave","MediSave tax relief","Basic Healthcare Sum 2026"],
    title:"Do I get tax relief for voluntary top-ups to the MediSave Account?",
    sum:"You can top up your own or a loved one's MediSave Account in cash and claim tax relief of up to SGD$8,000 a year. This SGD$8,000 is shared with your top-ups to your Special or Retirement Account.",
    pts:["The most a MediSave Account can receive is the Basic Healthcare Sum minus the current balance. The Basic Healthcare Sum is SGD$79,000 in 2026 for members below 65.","A top-up to MediSave cannot be reversed or refunded. If it goes over the limit, the extra is returned to you without interest.","From 1 January 2026, eligible members get a matching grant of up to SGD$1,000 a year on MediSave top-ups. Matched top-ups do not get tax relief.","For a spouse or sibling to get your top-up with tax relief, their income in the previous year must be SGD$8,000 or less, or they must be handicapped."],
    url:"https://www.cpf.gov.sg/service/article/do-i-get-tax-relief-for-voluntary-top-ups-to-the-medisave-account",
    links:[{t:"Terms for topping up MediSave",u:"https://www.cpf.gov.sg/member/tnc/tnc-top-up-medisave-account"}],
    login:"You will need your Singpass to make a top-up." },
  { id:"a12", q:"Set up small regular top-ups with GIRO",
    kw:["recurring top up CPF","GIRO CPF top up","regular CPF top up"],
    title:"How can I make recurring monthly or yearly top-ups conveniently via GIRO?",
    sum:"You do not need to top up in one big sum. You can set up small recurring cash top-ups by GIRO, so you do not fill in a form each time.",
    pts:["It takes two steps: first set up a GIRO arrangement with your bank, then submit a request for recurring cash top-ups for retirement. Both steps must be done.","Members aged 55 and above can also set up small monthly transfers from their Ordinary Account to their own Retirement Account.","To change a recurring arrangement, delete it and create a new one.","Top-ups cannot be reversed and are generally credited within 7 working days of CPF receiving payment."],
    url:"https://www.cpf.gov.sg/service/article/how-can-i-make-regular-monthly-or-yearly-top-ups-conveniently-via-giro",
    links:[{t:"Manage recurring top-ups and transfers",u:"https://www.cpf.gov.sg/member/tools-and-services/forms-e-applications/manage-recurring-cash-top-ups-and-cpf-transfers-for-retirement"}],
    login:"You will need your Singpass to set this up." },
  { id:"a13", q:"Top up early in the year for more interest",
    kw:["best time to top up CPF","top up January CPF","CPF compound interest"],
    title:"When is the best time to top up to grow my savings?",
    sum:"Topping up in January instead of December each year can earn up to 20% more interest on your top-ups over 10 years, because CPF interest is worked out monthly and compounds.",
    pts:["CPF's example assumes the 4% interest floor, extra interest of up to 2% on the first SGD$60,000, an SGD$8,000 yearly top-up and a SGD$0 starting balance.","Top up early in the year so it is processed before year end. Processing can take longer in December when many people apply.","CPF suggests keeping at least SGD$20,000 in your Ordinary Account for future needs and its extra 1% interest."],
    url:"https://www.cpf.gov.sg/service/article/when-is-the-best-time-to-top-up-to-grow-my-savings",
    links:[{t:"4 ways to grow your retirement payouts",u:"https://cpf.gov.sg/member/infohub/educational-resources/4-ways-to-grow-your-retirement-payouts"}] },
  { id:"a14", q:"Know where your CPF contributions go",
    kw:["CPF allocation rates","CPF OA SA MA split","CPF contribution allocation"],
    title:"CPF Allocation Rates from 1 January 2026",
    sum:"Your CPF contributions are split between your Ordinary, Special (or Retirement) and MediSave accounts by age. Knowing the split helps you decide what to top up.",
    pts:["Age 35 and below: about 62% to the Ordinary Account, 16% to the Special Account and 22% to MediSave. Above 35 to 45: about 57%, 19% and 24%.","The share going to retirement and MediSave rises as you get older. Above 55 to 60: about 35% Ordinary, 34% Retirement and 31% MediSave.","From 55, your contributions go to your Retirement Account first, up to the Full Retirement Sum."],
    url:"https://www.cpf.gov.sg/service/sfc/servlet.shepherd/document/download/069IW000005qFrJYAU",
    links:[] },
  { id:"a15", q:"Invest my CPF with the CPF Investment Scheme",
    kw:["CPFIS","invest CPF OA","CPF Investment Scheme"],
    title:"CPF Investment Scheme: what you need to know",
    sum:"CPFIS lets you invest part of your Ordinary and Special Account savings in products with different levels of risk. Your CPF savings keep earning risk-free interest if you choose not to invest.",
    pts:["You can invest your Ordinary Account savings after setting aside SGD$20,000, and your Special Account savings after setting aside SGD$40,000.","From your Ordinary Account, you can put up to 35% of your investible savings into stocks and up to 10% into gold.","CPF says to invest only if you are confident of earning more than the risk-free CPF interest. CPFIS investments are not covered by CPF nomination."],
    url:"https://cpf.gov.sg/member/infohub/educational-resources/cpf-investment-scheme-what-you-need-to-know-about-cpfis",
    links:[{t:"CPFIS guide (PDF)",u:"https://cpf.gov.sg/content/dam/web/member/growing-your-savings/documents/CPFIS_SAT_M2.pdf"}] },
  { id:"a16", q:"Check the Majulah Package if you were born in 1973 or earlier",
    kw:["Majulah Package","Earn and Save Bonus","Retirement Savings Bonus"],
    title:"Majulah Package",
    sum:"The Majulah Package supports Singapore Citizens born in 1973 or earlier. Its Earn and Save Bonus gives eligible working seniors a CPF top-up of SGD$400 to SGD$1,000 a year, with lower-income workers getting more.",
    pts:["It also has a one-time Retirement Savings Bonus (up to SGD$1,500) for those with lower CPF retirement savings, and a MediSave Bonus (up to SGD$2,000).","Every Singaporean born in 1973 or earlier gets at least one part of the package.","The MOM page explains who qualifies and when the money is credited. Check what applies to you."],
    url:"https://www.mom.gov.sg/employment-practices/schemes-for-employers-and-employees/majulah-package",
    site:"mom.gov.sg", prov:"MOM", links:[] },
  { id:"a17", q:"Self-employed or freelancing? Build your CPF yourself",
    kw:["self-employed CPF","MediSave self-employed","voluntary CPF contribution"],
    title:"Why do I need to make MediSave contributions as a self-employed person?",
    sum:"If you are self-employed and your net trade income is more than SGD$6,000 a year, you must contribute to MediSave. There is no employer to do it for you.",
    pts:["You must still contribute to MediSave after reaching the Basic Healthcare Sum. MediSave savings above that sum flow to your Special or Retirement Account first, then to your Ordinary Account.","You can also make voluntary contributions under the CPF Self-Employed Scheme to build up your retirement and housing savings.","MediSave and voluntary contributions may give tax relief. IRAS explains the rules."],
    url:"https://www.cpf.gov.sg/service/article/why-do-i-need-to-make-medisave-contributions-as-a-self-employed-person",
    links:[{t:"MediSave once you reach the Basic Healthcare Sum",u:"https://www.cpf.gov.sg/service/article/do-i-still-have-to-contribute-to-medisave-as-a-self-employed-person-even-though-my-medisave-balance-has-reached-the-basic-healthcare-sum-bhs"},{t:"IRAS: compulsory and voluntary MediSave contributions",u:"https://www.iras.gov.sg/taxes/individual-income-tax/employees/deductions-for-individuals/personal-reliefs-and-tax-rebates/compulsory-and-voluntary-medisave-contributions"}] },
  { id:"a18", q:"Know how bonuses count towards CPF",
    kw:["CPF bonus","Additional Wage ceiling","CPF annual wage ceiling"],
    title:"What is the Additional Wage (AW) ceiling?",
    sum:"Bonuses and other extra pay count as Additional Wages. The amount that attracts CPF is limited each year: SGD$102,000 minus the Ordinary Wages that were subject to CPF that year.",
    pts:["Example: if your Ordinary Wages subject to CPF are SGD$96,000 (SGD$8,000 a month), only SGD$6,000 of your bonus attracts CPF.","The ceiling applies per employer per calendar year.","If your bonus goes above the ceiling, the extra attracts no CPF. A cash top-up to your Special or Retirement Account is one way to add it to your retirement savings."],
    url:"https://www.cpf.gov.sg/service/article/what-is-the-additional-wage-aw-ceiling",
    links:[{t:"Contribution changes from 1 January 2026",u:"https://www.cpf.gov.sg/conrate2023"}] },
  { id:"a19", q:"Use CPF for your home wisely",
    kw:["CPF housing refund","CPF accrued interest","sell house CPF refund"],
    title:"Quick facts on housing withdrawals and CPF LIFE",
    sum:"When you sell a home bought with CPF, you refund the CPF you used, plus the interest that money would have earned, back to your own CPF account. So the money stays yours for retirement.",
    pts:["If the sale price, after paying off the loan, is not enough to refund everything, you do not need to top up the difference, as long as the home is sold at market value.","If you are above 55, the refund goes towards your Full Retirement Sum in your Retirement Account, which gives you higher monthly payouts.","The interest is what your Ordinary Account savings would have earned. The Ordinary Account pays 2.5% a year."],
    url:"https://www.cpf.gov.sg/member/infohub/cpf-clarifies/clarifications/quick-facts-on-housing-withdrawals-and-cpf-life",
    links:[{t:"CPF interest rates",u:"https://www.cpf.gov.sg/service/article/what-are-the-cpf-interest-rates"}] },
  { id:"a20", q:"Earn a lower wage? Get the Workfare Income Supplement",
    kw:["Workfare Income Supplement","WIS CPF","WIS payout"],
    title:"How much Workfare Income Supplement will I get?",
    sum:"The Workfare Income Supplement (WIS) tops up the income and CPF savings of lower-income workers. If you are an employee, 60% of your WIS goes into your CPF and 40% is paid in cash.",
    pts:["For Work Year 2025, the most you can get a year is SGD$2,450 (age 30 to 34), SGD$3,500 (35 to 44), SGD$4,200 (45 to 59) and SGD$4,900 (60 and above).","If you are self-employed, 10% is paid in cash and 90% goes into your MediSave Account.","Use CPF's online WIS calculator to estimate how much you could get."],
    url:"https://www.cpf.gov.sg/service/article/how-much-workfare-income-supplement-will-i-get",
    links:[{t:"About the Workfare Income Supplement",u:"https://www.cpf.gov.sg/member/growing-your-savings/government-support/workfare-income-supplement"}] }
);
