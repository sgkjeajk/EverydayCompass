      pts:["全额退休存款额是基本退休存款额的两倍，是默认要预留的金额。","增强退休存款额是基本退休存款额的四倍（自2025年起）。这是您为了领取更高入息，最多可增存到的金额。","您的基本和全额退休存款额，由您满55岁那一年决定，终身不变。增强退休存款额则每年上调（2027年为SGD$456,400）。","2027年的基本退休存款额是SGD$114,100，全额是SGD$228,200。"] },
    s7:{ q:"我可以用房子来满足退休存款额吗？",
      sum:"可以，只要您拥有地契年限至少能撑到95岁的房产。您可以抵押房产，只预留基本退休存款额，然后提取超出的部分。",
      pts:["代价是退休账户的钱变少，所以您的CPF LIFE每月入息会比较低。","出售房产时，您必须把所得款项归还公积金，并把退休账户补回全额退休存款额。"] },
    s8:{ q:"CPF LIFE比私人年金更好吗？",
      sum:"公积金局把标准计划与三个热门的私人退休入息计划作了比较。结果发现，把入息和遗产都算进去后，在几乎所有情况下，CPF LIFE的有效利率都更高。",
      pts:["这是公积金局自己的比较，所以也应该看看保险公司按您的年龄和金额提供的报价。","CPF LIFE让您终身领取入息，您的保费享有最高每年6%的公积金利息，没有风险。","CPF LIFE靠分担风险运作，就像保险一样。"] },
    s9:{ q:"加入后，我还能更改计划或增存吗？",
      sum:"您可以使用“规划我的每月入息”服务来更改计划、延后或重新开始领取入息。为退休账户增存，会提高您的入息。",
      pts:["如果更改计划，公积金局会把您整个退休账户的储蓄（包括旧计划退回的保费）当作新计划的保费。","您可以用现金或转账，为退休账户增存，最高增存到增强退休存款额。","增存的钱是为退休准备的，会以每月入息的方式发放。如果您已经开始领取入息，请到该服务页面了解适用的规定。"],
      login:"更改需要使用Singpass。" },
    s10:{ q:"我的入息能跟得上物价上涨吗？",
      sum:"递增计划是公积金局应对物价上涨的办法。它起步较低，之后终身每年增加2%。",
      pts:["标准计划发放稳定的金额。起步比递增计划高，但后期会比递增计划低。","公积金局建议：担心生活费上涨，可考虑递增计划；预计年纪大了开销会减少，可考虑标准计划。","等到70岁才开始领取，每延后一年，入息也最多增加7%。"] },
    a1:{ q:"为特别账户（或退休账户）增存，赚取更多利息",
      sum:"特别账户、医疗储蓄账户和退休账户的储蓄，每年赚取4%的利息。普通账户则是2.5%。所以为特别账户增存（满55岁后为退休账户增存），能让您的退休储蓄增长得更快。",
      pts:["您的特别账户在55岁时关闭，所以之后的增存会存入退休账户。","您可以在cpf.gov.sg/topup用PayNow现金增存，或用GIRO定期小额增存。","增存的钱是为退休准备的。日后会以每月入息的方式发放，不能当作现金用于其他用途。"],
      login:"增存需要使用Singpass。" },
    a2:{ q:"增存时获得税务减免",
      sum:"为自己的特别账户或退休账户现金增存，每年最多可获得SGD$8,000的税务减免；为亲人的账户增存，另可获得SGD$8,000。合共每年最多SGD$16,000。",
      pts:["减免只适用于现金增存，上限为当年的全额退休存款额。","为自己账户增存的SGD$8,000减免额，与为自己的医疗储蓄账户增存共用。","自2025年1月1日起，能获得MRSS配对津贴的现金增存，不再享有税务减免。"] },
    a3:{ q:"为父母或家人的公积金增存",
      sum:"您可以为家人的特别账户或退休账户增存，每年可获得最多SGD$8,000的税务减免，这是在您为自己账户增存的SGD$8,000之外另计的。",
      pts:["税务减免归您，也就是增存的人。","减免只计算到受惠人的全额退休存款额为止。","增存的钱会增加受惠人的退休储蓄，并在他们退休后以每月入息的方式发放给他们。","如果受惠人去世，剩余的增存款项会付给他们的公积金受益人。"],
      login:"增存需要使用Singpass。" },
    a4:{ q:"赚取头SGD$60,000的额外利息",
      sum:"政府为您公积金总余额的头SGD$60,000支付额外利息。55岁以下，额外利息是1%。55岁起，头SGD$30,000额外2%，接下来的SGD$30,000额外1%。",
      pts:["只有普通账户中最多SGD$20,000可计入。","普通账户储蓄赚取的额外利息，会存入您的特别账户或退休账户。","连同4%的基本利率，公积金局显示的有效利率，55岁以下最高5%，55岁起头SGD$30,000最高6%。","我查看的公积金网页上的利率，适用于2026年7月1日至9月30日。利率每季检讨。"] },
    a5:{ q:"把普通账户的储蓄转出，赚取4%",
      sum:"把钱从普通账户（2.5%）转到特别账户或退休账户（4%），能赚取更多利息。但转账立刻生效，而且不能撤回。",
      pts:["55岁以下，从普通账户转到特别账户。满55岁后特别账户关闭，所以转到退休账户，最高转到增强退休存款额。","转账前，先为房屋或其他需要保留足够的普通账户储蓄，因为钱转出去后不能转回来。","在网站上：用Singpass登录，选择公积金转账，输入金额，然后检查并确认。"],
      login:"转账需要使用Singpass。" },
    a6:{ q:"及早存够全额退休存款额",
      sum:"全额退休存款额是为退休预留的默认金额。2026年满55岁的人是SGD$220,400，而且一旦满55岁就终身不变。",
      pts:["55岁时，公积金局会开设您的退休账户，先转入特别账户储蓄，再转入普通账户储蓄，直到全额退休存款额为止。","如果不足，可在开始领取入息前，用现金增存和普通账户转账补足。","预留好之后，您可以提取超出部分的普通账户和特别账户储蓄。","抵押房产，可以只预留基本退休存款额（2026年为SGD$110,200），但您的入息会比较低。"] },
    a7:{ q:"延后领取CPF LIFE，换取更高的每月入息",
      sum:"您可以在65岁至70岁之间开始领取。每延后一年，每月入息最多增加7%，到70岁最多可增加35%。",
      pts:["公积金局的例子（2026年8月）：一名55岁男士的退休账户有SGD$220,400，选择标准计划，70岁开始领取，每月比65岁开始多约SGD$600。","入息会在70岁自动开始，即使您什么都没做。","请使用“规划我的每月入息”服务来延后或重新开始。"],
      login:"更改开始领取的年龄需要使用Singpass。" },
    a8:{ q:"增存到增强退休存款额",
      sum:"55岁起，您可以为退休账户增存到增强退休存款额，换取更高的每月入息。2026年是SGD$440,800，2027年是SGD$456,400。",
      pts:["自2025年起，增强退休存款额是基本退休存款额的四倍（2024年是SGD$308,700，2025年是SGD$426,000）。","退休账户的利率与特别账户相同。","增存和转账不能撤回。55岁后，您不能把它们取出来用于房屋、投资或其他需要。"],
      login:"增存需要使用Singpass。" },
    a9:{ q:"继续工作或赚多一点",
      sum:"自2026年1月1日起，公积金总缴存率是：55岁及以下为工资的37%，55岁以上至60岁为34%，60岁以上至65岁为25%，65岁以上至70岁为16.5%，70岁以上为12.5%。",
      pts:["55岁以上至65岁的缴存率在2026年上调。增加的部分会存入退休账户，直到存满全额退休存款额，之后存入普通账户。","55岁及以下：雇主17%，您20%。55岁以上至60岁：雇主16%，您18%。","2026年1月，公积金的每月工资上限提高到SGD$8,000。","这些缴存率适用于每月超过SGD$750的工资。"] },
    a10:{ q:"获得政府的配对津贴（MRSS）",
      sum:"如果符合资格，政府会为您的退休账户现金增存提供一对一的配对，每年最多SGD$2,000，终身上限SGD$20,000。",
      pts:["适用于55岁及以上、退休账户储蓄较少的新加坡公民。70岁的年龄上限已在2025年取消。","公积金局每年都会审核您的资格，您不需要申请。可在您的退休总览或cpf.gov.sg/checkmrss查看。","请在12月31日前完成增存。津贴会在下一年年初存入。","获得配对的增存，不享有税务减免。"],
      login:"请用Singpass登录，查看您是否符合资格。" }
  },

  ms: {
    s1:{ q:"Bilakah saya mula menerima bayaran, dan bolehkah saya menunggu?",
      sum:"Anda boleh mula menerima bayaran CPF LIFE pada bila-bila usia antara 65 hingga 70 tahun. Jika anda menunggu, bayaran bulanan anda meningkat sehingga 7% bagi setiap tahun anda menangguhkan.",
      pts:["Bermula pada usia 70 boleh meningkatkan bayaran anda sehingga kira-kira 35% berbanding bermula pada usia 65.","Jika anda tidak memberi arahan, bayaran bermula secara automatik pada usia 70. Anda tidak boleh menangguh melebihi 70.","CPF akan menulis kepada anda kira-kira tiga bulan sebelum hari lahir ke-65 untuk menerangkan pilihan anda.","Untuk menangguh, atau memulakan semula selepas menangguh, gunakan perkhidmatan “Plan my monthly payouts” (Rancang bayaran bulanan saya)."],
      login:"Anda memerlukan Singpass untuk mengubah bila bayaran anda bermula." },
    s2:{ q:"Berapakah yang akan saya terima setiap bulan?",
      sum:"Bayaran bulanan anda bergantung pada jumlah dalam Akaun Persaraan anda, pelan yang anda pilih, kadar faedah CPF, jantina anda, dan usia anda semasa bermula.",
      pts:["CPF mempunyai penganggar dalam talian di cpf.gov.sg/payout yang menunjukkan jumlah bulanan bagi setiap pelan.","Contoh CPF (Ogos 2026): seorang lelaki berusia 55 tahun dengan SGD$220,400 dalam Akaun Persaraannya pada Pelan Standard menerima kira-kira SGD$600 lebih sebulan jika bermula pada usia 70 berbanding 65.","Menokok Akaun Persaraan anda atau menangguh bayaran kedua-duanya menaikkan anggaran."],
      login:"Log masuk dengan Singpass untuk menggunakan baki Akaun Persaraan anda sendiri dalam anggaran." },
    s3:{ q:"Jika saya meninggal dunia awal, adakah keluarga saya mendapat wang itu?",
      sum:"Ya. Baki premium CPF LIFE yang tinggal, serta baki simpanan CPF anda yang lain, dibayar kepada benefisiari anda.",
      pts:["Baki premium ialah jumlah yang diambil daripada Akaun Persaraan anda semasa anda menyertai, tolak bayaran yang telah anda terima.","Ia dibayar mengikut penamaan CPF anda, jadi buat penamaan.","Penamaan CPF tidak meliputi hartanah yang dibeli dengan CPF atau pelaburan di bawah Skim Pelaburan CPF.","Anda boleh melihat baki premium anda di bahagian “Monthly payouts” pada Papan Pemuka Persaraan anda."],
      login:"Log masuk dengan Singpass untuk melihat baki premium anda sendiri." },
    s4:{ q:"Pelan mana yang patut saya pilih: Standard, Asas atau Meningkat?",
      sum:"Terdapat tiga pelan. Standard memberi bayaran tetap yang bermula lebih tinggi. Meningkat bermula lebih rendah dan naik 2% setiap tahun. Asas memberi bayaran lebih rendah yang menurun lagi kemudian.",
      pts:["Asas ialah pelan lama dari 2009. Kira-kira 10 hingga 20% simpanan anda menjadi premium, dan bayaran menurun apabila baki CPF gabungan anda jatuh di bawah SGD$60,000. CPF berkata ramai ahli mendapati Standard atau Meningkat lebih sesuai.","Pada ketiga-tiga pelan, anda dibayar seumur hidup, premium anda memperoleh faedah CPF tanpa risiko, dan baki premium dibayar kepada benefisiari anda.","Jika anda tidak memberi arahan menjelang usia 70, anda ditempatkan pada Pelan Standard."] },
    s5:{ q:"Bolehkah saya mengeluarkan wang saya sekali gus?",
      sum:"Hanya sebahagian. Dari usia 55 anda boleh mengeluarkan SGD$5,000, atau sebarang simpanan Akaun Biasa dan Akaun Khas melebihi Jumlah Persaraan Penuh anda. Selebihnya disimpan untuk membayar bayaran bulanan anda.",
      pts:["Jika anda lahir pada 1958 atau kemudian, anda boleh mengeluarkan sehingga 20% simpanan persaraan anda pada usia 65. Ini termasuk SGD$5,000 itu.","Pemilik hartanah yang baki pajakannya mencukupi sehingga sekurang-kurangnya usia 95 tahun boleh mengeluarkan simpanan Akaun Persaraan melebihi Jumlah Persaraan Asas.","Tokokan tunai, pindahan CPF dan geran kerajaan tidak boleh dikeluarkan, kerana ia bertujuan menaikkan bayaran anda."],
      login:"Papan Pemuka Persaraan anda menunjukkan jumlah tepat yang boleh dikeluarkan. Anda memerlukan Singpass." },
    s6:{ q:"Apakah BRS, FRS dan ERS, dan yang mana patut saya ketepikan?",
      sum:"Ini ialah tiga tahap simpanan untuk diketepikan pada usia 55. Bagi yang berusia 55 pada 2026: Asas SGD$110,200, Penuh SGD$220,400, Dipertingkat SGD$440,800.",
      pts:["Jumlah Persaraan Penuh ialah dua kali ganda Jumlah Asas, dan merupakan jumlah lalai untuk diketepikan.","Jumlah Persaraan Dipertingkat ialah empat kali ganda Jumlah Asas (sejak 2025). Ia jumlah paling tinggi yang boleh anda tokok untuk bayaran lebih tinggi.","Jumlah Asas dan Penuh anda ditetapkan seumur hidup mengikut tahun anda berusia 55. Jumlah Dipertingkat naik setiap tahun (SGD$456,400 pada 2027).","Pada 2027 Jumlah Asas ialah SGD$114,100 dan Jumlah Penuh ialah SGD$228,200."] },
    s7:{ q:"Bolehkah saya menggunakan rumah saya untuk memenuhi Jumlah Persaraan?",
      sum:"Boleh, jika anda memiliki hartanah dengan baki pajakan sehingga sekurang-kurangnya usia 95. Anda boleh mengikrarkannya dan mengetepikan Jumlah Persaraan Asas sahaja, kemudian mengeluarkan simpanan melebihi jumlah itu.",
      pts:["Pertukarannya ialah Akaun Persaraan yang lebih kecil, jadi bayaran bulanan CPF LIFE anda akan lebih rendah.","Apabila anda menjual hartanah itu, anda mesti memulangkan hasil jualan ke CPF anda dan memulihkan Akaun Persaraan anda sehingga Jumlah Persaraan Penuh."] },
    s8:{ q:"Adakah CPF LIFE lebih baik daripada anuiti swasta?",
      sum:"CPF membandingkan Pelan Standardnya dengan tiga pelan pendapatan persaraan swasta yang popular. Didapati faedah efektif CPF LIFE lebih tinggi dalam hampir semua keadaan selepas mengambil kira bayaran dan wasiat.",
      pts:["Ini perbandingan CPF sendiri, jadi lihat juga sebut harga daripada syarikat insurans untuk usia dan jumlah anda.","CPF LIFE membayar seumur hidup, dan premium anda memperoleh faedah CPF sehingga 6% setahun, tanpa risiko.","CPF LIFE berfungsi dengan mengumpulkan risiko, seperti insurans."] },
    s9:{ q:"Bolehkah saya menukar pelan atau menokok selepas menyertai?",
      sum:"Anda boleh menggunakan perkhidmatan “Plan my monthly payouts” untuk menukar pelan, menangguh atau memulakan semula bayaran. Menokok Akaun Persaraan anda menaikkan bayaran anda.",
      pts:["Jika anda menukar pelan, CPF mengambil seluruh simpanan Akaun Persaraan anda, termasuk premium yang dipulangkan daripada pelan lama, sebagai premium bagi pelan baru.","Anda boleh menokok Akaun Persaraan anda, secara tunai atau pindahan, sehingga Jumlah Persaraan Dipertingkat.","Wang tokokan adalah untuk persaraan dan dibayar sebagai bayaran bulanan. Jika bayaran anda sudah bermula, semak halaman perkhidmatan untuk apa yang terpakai kepada anda."],
      login:"Anda memerlukan Singpass untuk membuat perubahan." },
    s10:{ q:"Adakah bayaran saya akan sejajar dengan kenaikan harga?",
      sum:"Pelan Meningkat ialah jawapan CPF kepada kenaikan harga. Ia bermula lebih rendah, kemudian naik 2% setiap tahun seumur hidup.",
      pts:["Pelan Standard membayar jumlah tetap. Ia bermula lebih tinggi daripada Meningkat, tetapi lebih rendah pada tahun-tahun kemudian.","CPF mencadangkan Meningkat jika anda bimbang kos sara hidup, dan Standard jika anda menjangka berbelanja kurang apabila semakin tua.","Menunggu sehingga usia 70 untuk bermula juga menaikkan bayaran anda, sehingga 7% bagi setiap tahun anda menangguh."] },
    a1:{ q:"Tokok Akaun Khas (atau Akaun Persaraan) untuk memperoleh lebih banyak",
      sum:"Simpanan dalam Akaun Khas, MediSave dan Persaraan memperoleh 4% setahun. Akaun Biasa memperoleh 2.5%. Jadi menokok Akaun Khas anda, atau Akaun Persaraan apabila anda berusia 55, mengembangkan wang persaraan anda dengan lebih pantas.",
      pts:["Akaun Khas anda ditutup pada usia 55, jadi selepas itu tokokan masuk ke Akaun Persaraan anda.","Anda boleh menokok secara tunai melalui PayNow, atau dengan jumlah kecil yang tetap melalui GIRO, di cpf.gov.sg/topup.","Tokokan adalah untuk persaraan. Ia dibayar sebagai bayaran bulanan kemudian, bukan wang tunai untuk kegunaan lain."],
      login:"Anda memerlukan Singpass untuk membuat tokokan." },
    a2:{ q:"Dapatkan pelepasan cukai apabila saya menokok",
      sum:"Anda boleh mendapat pelepasan cukai sehingga SGD$8,000 setahun bagi tokokan tunai ke Akaun Khas atau Persaraan anda sendiri, dan SGD$8,000 lagi bagi tokokan untuk insan tersayang. Itu sehingga SGD$16,000 setahun.",
      pts:["Pelepasan hanya terpakai kepada tokokan tunai, sehingga Jumlah Persaraan Penuh tahun semasa.","SGD$8,000 untuk akaun anda sendiri dikongsi dengan tokokan ke Akaun MediSave anda sendiri.","Sejak 1 Januari 2025, tokokan tunai yang memperoleh geran padanan MRSS tidak lagi mendapat pelepasan cukai."] },
    a3:{ q:"Tokok CPF ibu bapa atau keluarga saya",
      sum:"Anda boleh menokok Akaun Khas atau Persaraan ahli keluarga, dan anda mendapat pelepasan cukai sehingga SGD$8,000 setahun untuknya, tambahan kepada SGD$8,000 untuk akaun anda sendiri.",
      pts:["Pelepasan cukai diberikan kepada anda, orang yang memberi tokokan.","Pelepasan dikira hanya sehingga Jumlah Persaraan Penuh orang yang anda tokok.","Tokokan membina simpanan persaraan penerima dan dibayar kepada mereka sebagai bayaran bulanan semasa bersara.","Jika penerima meninggal dunia, baki tokokan dibayar kepada penama CPF mereka."],
      login:"Anda memerlukan Singpass untuk membuat tokokan." },
    a4:{ q:"Dapatkan faedah tambahan pada SGD$60,000 pertama saya",
      sum:"Kerajaan membayar faedah tambahan pada SGD$60,000 pertama baki CPF gabungan anda. Di bawah 55 tahun, ia tambahan 1%. Dari usia 55, tambahan 2% pada SGD$30,000 pertama dan tambahan 1% pada SGD$30,000 seterusnya.",
      pts:["Hanya sehingga SGD$20,000 daripada Akaun Biasa anda dikira.","Faedah tambahan yang diperoleh daripada simpanan Akaun Biasa dimasukkan ke Akaun Khas atau Persaraan anda.","Bersama kadar asas 4%, CPF menunjukkan kadar efektif sehingga 5% di bawah 55 tahun, dan sehingga 6% pada SGD$30,000 pertama dari usia 55.","Kadar pada halaman CPF yang saya semak adalah untuk 1 Julai hingga 30 September 2026. Ia disemak setiap suku tahun."] },
    a5:{ q:"Pindahkan simpanan Akaun Biasa saya untuk memperoleh 4%",
      sum:"Memindahkan wang daripada Akaun Biasa (2.5%) ke Akaun Khas atau Persaraan (4%) memperoleh lebih banyak faedah. Tetapi pindahan itu serta-merta dan tidak boleh dibatalkan.",
      pts:["Di bawah 55 tahun, anda pindahkan dari Akaun Biasa ke Akaun Khas. Dari usia 55 Akaun Khas anda ditutup, jadi anda pindahkan ke Akaun Persaraan, sehingga Jumlah Persaraan Dipertingkat.","Simpan simpanan Akaun Biasa yang mencukupi untuk perumahan atau keperluan lain dahulu, kerana anda tidak boleh memindahkan wang itu kembali.","Di laman web: log masuk dengan Singpass, pilih pindahan CPF, masukkan jumlah, kemudian semak dan sahkan."],
      login:"Anda memerlukan Singpass untuk membuat pindahan." },
    a6:{ q:"Capai Jumlah Persaraan Penuh lebih awal",
      sum:"Jumlah Persaraan Penuh ialah jumlah lalai untuk diketepikan bagi persaraan. Bagi yang berusia 55 pada 2026 ia ialah SGD$220,400, dan kekal sama seumur hidup sebaik sahaja anda berusia 55.",
      pts:["Pada usia 55, CPF membuka Akaun Persaraan anda dan memindahkan simpanan Akaun Khas dahulu, kemudian Akaun Biasa, sehingga Jumlah Persaraan Penuh.","Jika anda kekurangan, tokokan tunai dan pindahan Akaun Biasa boleh menampung kekurangan itu sebelum bayaran bermula.","Sebaik sahaja anda mengetepikannya, anda boleh mengeluarkan simpanan Akaun Biasa dan Akaun Khas melebihi jumlah itu.","Ikrar hartanah membolehkan anda mengetepikan Jumlah Persaraan Asas sahaja (SGD$110,200 bagi 2026), tetapi bayaran anda akan lebih rendah."] },
    a7:{ q:"Tangguhkan bayaran CPF LIFE saya untuk jumlah bulanan yang lebih tinggi",
      sum:"Anda boleh bermula antara 65 dan 70 tahun. Bagi setiap tahun anda menunggu, bayaran bulanan anda meningkat sehingga 7%, yang boleh mencapai peningkatan 35% pada usia 70.",
      pts:["Contoh CPF (Ogos 2026): seorang lelaki berusia 55 tahun dengan SGD$220,400 dalam Akaun Persaraannya pada Pelan Standard menerima kira-kira SGD$600 lebih sebulan jika bermula pada usia 70 berbanding 65.","Bayaran bermula secara automatik pada usia 70, walaupun anda tidak berbuat apa-apa.","Gunakan perkhidmatan “Plan my monthly payouts” untuk menangguh atau memulakan semula."],
      login:"Anda memerlukan Singpass untuk menukar usia permulaan anda." },
    a8:{ q:"Tokok sehingga Jumlah Persaraan Dipertingkat",
      sum:"Dari usia 55 anda boleh menokok Akaun Persaraan anda sehingga Jumlah Persaraan Dipertingkat untuk bayaran bulanan yang lebih tinggi. Ia SGD$440,800 pada 2026 dan SGD$456,400 pada 2027.",
      pts:["Sejak 2025 Jumlah Persaraan Dipertingkat ialah empat kali ganda Jumlah Persaraan Asas (ia SGD$308,700 pada 2024, kemudian SGD$426,000 pada 2025).","Akaun Persaraan memberi faedah yang sama seperti Akaun Khas.","Tokokan dan pindahan tidak boleh dibatalkan. Selepas 55 anda tidak boleh mengeluarkannya untuk perumahan, pelaburan atau keperluan lain."],
      login:"Anda memerlukan Singpass untuk menokok." },
    a9:{ q:"Terus bekerja atau berpendapatan lebih",
      sum:"Mulai 1 Januari 2026, jumlah caruman CPF ialah 37% daripada gaji bagi usia 55 dan ke bawah, 34% bagi lebih 55 hingga 60, 25% bagi lebih 60 hingga 65, 16.5% bagi lebih 65 hingga 70, dan 12.5% bagi lebih 70.",
      pts:["Mereka yang berusia lebih 55 hingga 65 melihat kadar mereka naik pada 2026. Kenaikan itu masuk ke Akaun Persaraan sehingga Jumlah Persaraan Penuh dicapai, kemudian ke Akaun Biasa.","Usia 55 dan ke bawah: majikan 17% dan anda 20%. Lebih 55 hingga 60: majikan 16% dan anda 18%.","Siling gaji bulanan untuk CPF naik kepada SGD$8,000 pada Januari 2026.","Kadar ini terpakai kepada gaji melebihi SGD$750 sebulan."] },
    a10:{ q:"Dapatkan geran padanan Kerajaan (MRSS)",
      sum:"Jika anda layak, Kerajaan memadankan tokokan tunai anda ke Akaun Persaraan dolar demi dolar, sehingga SGD$2,000 setahun, dengan had seumur hidup SGD$20,000.",
      pts:["Ia untuk Warganegara Singapura berusia 55 tahun ke atas dengan simpanan Akaun Persaraan yang lebih rendah. Had umur 70 tahun dihapuskan pada 2025.","CPF menyemak kelayakan anda setiap tahun, jadi anda tidak perlu memohon. Semak di Papan Pemuka Persaraan anda atau di cpf.gov.sg/checkmrss.","Buat tokokan anda sebelum 31 Disember. Geran dikreditkan pada awal tahun berikutnya.","Tokokan yang memperoleh padanan tidak layak mendapat pelepasan cukai."],
      login:"Log masuk dengan Singpass untuk menyemak sama ada anda layak." }
  },

  ta: {
    s1:{ q:"எனக்குத் தொகை எப்போது கிடைக்கத் தொடங்கும்? காத்திருக்கலாமா?",
      sum:"65 முதல் 70 வயதுக்குள் எந்த வயதிலும் CPF LIFE மாதாந்திரத் தொகையைப் பெறத் தொடங்கலாம். நீங்கள் ஒத்திவைத்தால், ஒத்திவைக்கும் ஒவ்வோர் ஆண்டுக்கும் உங்கள் மாதாந்திரத் தொகை 7% வரை அதிகரிக்கும்.",
      pts:["70 வயதில் தொடங்கினால், 65 வயதில் தொடங்குவதை விட உங்கள் தொகை ஏறக்குறைய 35% வரை அதிகரிக்கலாம்.","நீங்கள் எந்த அறிவுறுத்தலும் தராவிட்டால், 70 வயதில் தொகை தானாகவே தொடங்கும். 70-ஐத் தாண்டி ஒத்திவைக்க முடியாது.","உங்கள் 65-ஆவது பிறந்த நாளுக்கு ஏறக்குறைய மூன்று மாதங்கள் முன்பு, உங்கள் தேர்வுகளை விளக்க CPF உங்களுக்கு எழுதும்.","ஒத்திவைக்க, அல்லது ஒத்திவைத்த பின் மீண்டும் தொடங்க, “Plan my monthly payouts” (என் மாதாந்திரத் தொகையைத் திட்டமிடு) சேவையைப் பயன்படுத்துங்கள்."],
      login:"உங்கள் தொகை தொடங்கும் நேரத்தை மாற்ற Singpass தேவை." },
    s2:{ q:"ஒவ்வொரு மாதமும் எனக்கு எவ்வளவு கிடைக்கும்?",
      sum:"உங்கள் மாதாந்திரத் தொகை, உங்கள் ஓய்வுக் கணக்கில் உள்ள சேமிப்பு, நீங்கள் தேர்ந்தெடுக்கும் திட்டம், CPF வட்டி விகிதம், உங்கள் பாலினம், தொடங்கும்போது உங்கள் வயது ஆகியவற்றைப் பொறுத்தது.",
      pts:["ஒவ்வொரு திட்டத்தின் கீழும் மாதாந்திரத் தொகையைக் காட்டும் இணைய மதிப்பீட்டுக் கருவி cpf.gov.sg/payout-இல் உள்ளது.","CPF தந்த எடுத்துக்காட்டு (2026 ஆகஸ்ட்): ஓய்வுக் கணக்கில் SGD$220,400 உள்ள 55 வயது ஆண், நிலையான திட்டத்தில், 65-க்குப் பதிலாக 70 வயதில் தொடங்கினால் மாதத்திற்கு ஏறக்குறைய SGD$600 கூடுதலாகப் பெறுவார்.","ஓய்வுக் கணக்கில் டாப்-அப் செய்தல் அல்லது ஒத்திவைத்தல், இரண்டுமே மதிப்பீட்டை உயர்த்தும்."],
      login:"மதிப்பீட்டில் உங்கள் சொந்த ஓய்வுக் கணக்கு இருப்பைப் பயன்படுத்த Singpass மூலம் உள்நுழையுங்கள்." },
    s3:{ q:"நான் சீக்கிரம் இறந்துவிட்டால், என் குடும்பத்திற்குப் பணம் கிடைக்குமா?",
      sum:"ஆம். மீதமுள்ள CPF LIFE பிரீமியம் இருப்பும், உங்கள் மற்ற CPF சேமிப்பும் உங்கள் பயனாளிகளுக்குச் செலுத்தப்படும்.",
      pts:["பிரீமியம் இருப்பு என்பது, நீங்கள் சேரும்போது உங்கள் ஓய்வுக் கணக்கிலிருந்து எடுக்கப்பட்ட தொகையிலிருந்து, நீங்கள் ஏற்கெனவே பெற்ற தொகையைக் கழித்தது.","அது உங்கள் CPF நியமனத்தின்படி செலுத்தப்படும்; எனவே ஒரு நியமனம் செய்யுங்கள்.","CPF நியமனம், CPF-ஐப் பயன்படுத்தி வாங்கிய சொத்தையும் CPF முதலீட்டுத் திட்ட முதலீடுகளையும் உள்ளடக்காது.","உங்கள் ஓய்வு முகப்புப் பக்கத்தின் “Monthly payouts” பகுதியில் உங்கள் பிரீமியம் இருப்பைப் பார்க்கலாம்."],
      login:"உங்கள் சொந்த பிரீமியம் இருப்பைப் பார்க்க Singpass மூலம் உள்நுழையுங்கள்." },
    s4:{ q:"எந்தத் திட்டத்தைத் தேர்ந்தெடுப்பது: நிலையான, அடிப்படை, அல்லது அதிகரிக்கும்?",
      sum:"மூன்று திட்டங்கள் உள்ளன. நிலையான திட்டம் உயர்ந்த தொகையில் தொடங்கி நிலையாகத் தரும். அதிகரிக்கும் திட்டம் குறைவாகத் தொடங்கி ஆண்டுதோறும் 2% உயரும். அடிப்படைத் திட்டம் குறைந்த தொகையைத் தரும், பிறகு மேலும் குறையும்.",
      pts:["அடிப்படைத் திட்டம் 2009-இல் வந்த பழைய திட்டம். உங்கள் சேமிப்பில் ஏறக்குறைய 10 முதல் 20% பிரீமியம் ஆகிறது; உங்கள் ஒருங்கிணைந்த CPF இருப்பு SGD$60,000-க்குக் கீழே குறைந்தால் தொகை குறையும். பல உறுப்பினர்களுக்கு நிலையான அல்லது அதிகரிக்கும் திட்டம் பொருத்தமாக இருப்பதாக CPF கூறுகிறது.","மூன்று திட்டங்களிலும் நீங்கள் வாழ்நாள் முழுவதும் தொகை பெறுவீர்கள்; உங்கள் பிரீமியத்திற்கு ஆபத்தில்லாத CPF வட்டி கிடைக்கும்; மீதமுள்ள பிரீமியம் உங்கள் பயனாளிகளுக்குச் செல்லும்.","70 வயதுக்குள் நீங்கள் எந்த அறிவுறுத்தலும் தராவிட்டால், நிலையான திட்டத்தில் சேர்க்கப்படுவீர்கள்."] },
    s5:{ q:"என் பணத்தை ஒரே தொகையாக எடுக்க முடியுமா?",
      sum:"ஒரு பகுதியை மட்டுமே. 55 வயதிலிருந்து SGD$5,000 எடுக்கலாம்; அல்லது உங்கள் முழு ஓய்வுத் தொகைக்கு மேல் உள்ள சாதாரணக் கணக்கு, சிறப்புக் கணக்குச் சேமிப்பை எடுக்கலாம். மீதம் உங்கள் மாதாந்திரத் தொகைக்காக வைக்கப்படும்.",
      pts:["நீங்கள் 1958 அல்லது அதற்குப் பின் பிறந்தவராக இருந்தால், 65 வயதில் உங்கள் ஓய்வுச் சேமிப்பில் 20% வரை எடுக்கலாம். இதில் அந்த SGD$5,000-மும் அடங்கும்.","குத்தகைக் காலம் குறைந்தது 95 வயது வரை நீடிக்கும் சொத்து உள்ளவர்கள், அடிப்படை ஓய்வுத் தொகைக்கு மேல் உள்ள ஓய்வுக் கணக்குச் சேமிப்பை எடுக்கலாம்.","ரொக்க டாப்-அப், CPF மாற்றங்கள், அரசாங்க மானியங்களை எடுக்க முடியாது; ஏனெனில் அவை உங்கள் தொகையை உயர்த்துவதற்கானவை."],
      login:"நீங்கள் எடுக்கக்கூடிய சரியான தொகையை உங்கள் ஓய்வு முகப்புப் பக்கம் காட்டும். Singpass தேவை." },
    s6:{ q:"BRS, FRS, ERS என்றால் என்ன? எதை ஒதுக்கி வைக்க வேண்டும்?",
      sum:"இவை 55 வயதில் ஒதுக்கி வைக்க வேண்டிய மூன்று சேமிப்பு நிலைகள். 2026-இல் 55 வயதை அடைவோருக்கு: அடிப்படை SGD$110,200, முழு SGD$220,400, மேம்படுத்தப்பட்ட SGD$440,800.",
      pts:["முழு ஓய்வுத் தொகை, அடிப்படைத் தொகையின் இரு மடங்கு; ஒதுக்கி வைக்க வேண்டிய இயல்புநிலைத் தொகை இதுவே.","மேம்படுத்தப்பட்ட ஓய்வுத் தொகை, அடிப்படைத் தொகையின் நான்கு மடங்கு (2025 முதல்). அதிகத் தொகைக்காக நீங்கள் டாப்-அப் செய்யக்கூடிய உச்சவரம்பு இதுவே.","உங்கள் அடிப்படை, முழு ஓய்வுத் தொகைகள், நீங்கள் 55 வயதை அடையும் ஆண்டால் வாழ்நாள் முழுவதும் நிர்ணயிக்கப்படும். மேம்படுத்தப்பட்ட தொகை ஆண்டுதோறும் உயரும் (2027-இல் SGD$456,400).","2027-இல் அடிப்படைத் தொகை SGD$114,100, முழுத் தொகை SGD$228,200."] },
    s7:{ q:"ஓய்வுத் தொகையை நிறைவு செய்ய என் வீட்டைப் பயன்படுத்தலாமா?",
      sum:"ஆம், குத்தகைக் காலம் குறைந்தது 95 வயது வரை நீடிக்கும் சொத்து உங்களிடம் இருந்தால். அதை அடமானமாக வைத்து, அடிப்படை ஓய்வுத் தொகையை மட்டும் ஒதுக்கி, அதற்கு மேல் உள்ள சேமிப்பை எடுக்கலாம்.",
      pts:["இதன் விலை, சிறிய ஓய்வுக் கணக்கு; எனவே உங்கள் CPF LIFE மாதாந்திரத் தொகை குறைவாக இருக்கும்.","சொத்தை விற்கும்போது, கிடைக்கும் தொகையை CPF-க்குத் திருப்பிச் செலுத்தி, உங்கள் ஓய்வுக் கணக்கை முழு ஓய்வுத் தொகை வரை மீட்டெடுக்க வேண்டும்."] },
    s8:{ q:"தனியார் ஆண்டுத்தொகையை விட CPF LIFE சிறந்ததா?",
      sum:"CPF தனது நிலையான திட்டத்தை மூன்று பிரபல தனியார் ஓய்வு வருமானத் திட்டங்களுடன் ஒப்பிட்டது. தொகைகளையும் மரபுச் சொத்தையும் கணக்கிட்ட பிறகு, கிட்டத்தட்ட எல்லாச் சூழல்களிலும் CPF LIFE-இன் பயனுள்ள வட்டி அதிகம் என்று அது கண்டது.",
      pts:["இது CPF-ன் சொந்த ஒப்பீடு; எனவே உங்கள் வயதுக்கும் தொகைக்கும் காப்புறுதி நிறுவனங்களின் விலைப்புள்ளிகளையும் பாருங்கள்.","CPF LIFE வாழ்நாள் முழுவதும் தரும்; உங்கள் பிரீமியத்திற்கு ஆண்டுக்கு 6% வரை, ஆபத்தின்றி, CPF வட்டி கிடைக்கும்.","CPF LIFE, காப்புறுதியைப் போல ஆபத்தைப் பகிர்ந்து செயல்படுகிறது."] },
    s9:{ q:"சேர்ந்த பிறகு திட்டத்தை மாற்றவோ டாப்-அப் செய்யவோ முடியுமா?",
      sum:"திட்டத்தை மாற்ற, தொகையை ஒத்திவைக்க அல்லது மீண்டும் தொடங்க, “Plan my monthly payouts” சேவையைப் பயன்படுத்தலாம். உங்கள் ஓய்வுக் கணக்கில் டாப்-அப் செய்தால் தொகை உயரும்.",
      pts:["நீங்கள் திட்டத்தை மாற்றினால், பழைய திட்டத்திலிருந்து திரும்பக் கிடைக்கும் பிரீமியம் உட்பட, உங்கள் ஓய்வுக் கணக்கின் முழுச் சேமிப்பையும் புதிய திட்டத்தின் பிரீமியமாக CPF எடுத்துக்கொள்ளும்.","உங்கள் ஓய்வுக் கணக்கில், ரொக்கமாகவோ மாற்றமாகவோ, மேம்படுத்தப்பட்ட ஓய்வுத் தொகை வரை டாப்-அப் செய்யலாம்.","டாப்-அப் பணம் ஓய்வுக்கானது; மாதாந்திரத் தொகையாக வழங்கப்படும். உங்கள் தொகை ஏற்கெனவே தொடங்கியிருந்தால், உங்களுக்கு என்ன பொருந்தும் என்பதை சேவைப் பக்கத்தில் பாருங்கள்."],
      login:"மாற்றங்களைச் செய்ய Singpass தேவை." },
    s10:{ q:"விலைவாசி உயர்வுக்கு ஏற்ப என் தொகை உயருமா?",
      sum:"அதிகரிக்கும் திட்டம் விலைவாசி உயர்வுக்கான CPF-ன் பதில். இது குறைவாகத் தொடங்கி, வாழ்நாள் முழுவதும் ஆண்டுதோறும் 2% உயரும்.",
      pts:["நிலையான திட்டம் ஒரே தொகையைத் தரும். அது அதிகரிக்கும் திட்டத்தை விட உயர்வாகத் தொடங்கும்; ஆனால் பிந்தைய ஆண்டுகளில் குறைவாக இருக்கும்.","வாழ்க்கைச் செலவு பற்றிக் கவலை இருந்தால் அதிகரிக்கும் திட்டத்தையும், வயதாகும்போது செலவு குறையும் என எதிர்பார்த்தால் நிலையான திட்டத்தையும் CPF பரிந்துரைக்கிறது.","70 வயது வரை காத்திருந்து தொடங்கினாலும் உங்கள் தொகை உயரும்; ஒத்திவைக்கும் ஒவ்வோர் ஆண்டுக்கும் 7% வரை."] },
    a1:{ q:"சிறப்புக் கணக்கில் (அல்லது ஓய்வுக் கணக்கில்) டாப்-அப் செய்து அதிகம் ஈட்டுங்கள்",
      sum:"சிறப்பு, மெடிசேவ், ஓய்வுக் கணக்குகளில் உள்ள சேமிப்புக்கு ஆண்டுக்கு 4% வட்டி கிடைக்கும். சாதாரணக் கணக்குக்கு 2.5%. எனவே உங்கள் சிறப்புக் கணக்கில் (55 வயதான பிறகு ஓய்வுக் கணக்கில்) டாப்-அப் செய்தால், உங்கள் ஓய்வுப் பணம் வேகமாக வளரும்.",
      pts:["உங்கள் சிறப்புக் கணக்கு 55 வயதில் மூடப்படும்; அதன் பிறகு டாப்-அப்கள் உங்கள் ஓய்வுக் கணக்கிற்குச் செல்லும்.","cpf.gov.sg/topup-இல் PayNow மூலம் ரொக்கமாகவும், GIRO மூலம் சிறிய தொகைகளைத் தொடர்ந்தும் டாப்-அப் செய்யலாம்.","டாப்-அப்கள் ஓய்வுக்கானவை. அவை பின்னர் மாதாந்திரத் தொகையாக வழங்கப்படும்; வேறு பயன்பாட்டுக்கான ரொக்கமாக அல்ல."],
      login:"டாப்-அப் செய்ய Singpass தேவை." },
    a2:{ q:"டாப்-அப் செய்யும்போது வரிக் கழிவு பெறுங்கள்",
      sum:"உங்கள் சொந்த சிறப்புக் கணக்கு அல்லது ஓய்வுக் கணக்கில் செய்யும் ரொக்க டாப்-அப்புகளுக்கு ஆண்டுக்கு SGD$8,000 வரை வரிக் கழிவு பெறலாம்; அன்புக்குரியவர்களின் கணக்குகளுக்கு மேலும் SGD$8,000. அது ஆண்டுக்கு SGD$16,000 வரை.",
      pts:["கழிவு ரொக்க டாப்-அப்களுக்கு மட்டுமே பொருந்தும்; அந்த ஆண்டின் முழு ஓய்வுத் தொகை வரை.","உங்கள் சொந்தக் கணக்கிற்கான SGD$8,000, உங்கள் சொந்த மெடிசேவ் கணக்கில் செய்யும் டாப்-அப்களுடன் பகிரப்படும்.","2025 ஜனவரி 1 முதல், MRSS பொருத்த மானியம் பெறும் ரொக்க டாப்-அப்களுக்கு வரிக் கழிவு இல்லை."] },
    a3:{ q:"என் பெற்றோர் அல்லது குடும்பத்தின் CPF-இல் டாப்-அப் செய்ய",
      sum:"குடும்ப உறுப்பினர்களின் சிறப்பு அல்லது ஓய்வுக் கணக்கில் டாப்-அப் செய்யலாம்; அதற்கு ஆண்டுக்கு SGD$8,000 வரை வரிக் கழிவு கிடைக்கும். இது உங்கள் சொந்தக் கணக்கிற்கான SGD$8,000-க்கு மேலதிகமானது.",
      pts:["வரிக் கழிவு, டாப்-அப் செய்யும் உங்களுக்கே கிடைக்கும்.","நீங்கள் டாப்-அப் செய்பவரின் முழு ஓய்வுத் தொகை வரை மட்டுமே கழிவு கணக்கிடப்படும்.","டாப்-அப்கள் பெறுபவரின் ஓய்வுச் சேமிப்பை உயர்த்தி, ஓய்வுக் காலத்தில் அவருக்கு மாதாந்திரத் தொகையாக வழங்கப்படும்.","பெறுபவர் காலமானால், மீதமுள்ள டாப்-அப்கள் அவருடைய CPF நியமனதாரர்களுக்குச் செல்லும்."],
      login:"டாப்-அப் செய்ய Singpass தேவை." },
    a4:{ q:"என் முதல் SGD$60,000-க்கு கூடுதல் வட்டி பெறுங்கள்",
      sum:"உங்கள் ஒருங்கிணைந்த CPF இருப்பின் முதல் SGD$60,000-க்கு அரசாங்கம் கூடுதல் வட்டி தருகிறது. 55-க்குக் கீழ், கூடுதலாக 1%. 55 வயதிலிருந்து, முதல் SGD$30,000-க்கு கூடுதலாக 2%, அடுத்த SGD$30,000-க்கு கூடுதலாக 1%.",
      pts:["உங்கள் சாதாரணக் கணக்கிலிருந்து அதிகபட்சம் SGD$20,000 மட்டுமே கணக்கில் சேரும்.","சாதாரணக் கணக்குச் சேமிப்புக்கான கூடுதல் வட்டி, உங்கள் சிறப்பு அல்லது ஓய்வுக் கணக்கில் சேர்க்கப்படும்.","4% அடிப்படை விகிதத்துடன், 55-க்குக் கீழ் 5% வரையும், 55 வயதிலிருந்து முதல் SGD$30,000-க்கு 6% வரையும் பயனுள்ள விகிதங்களை CPF காட்டுகிறது.","நான் பார்த்த CPF பக்கத்தின் விகிதங்கள் 2026 ஜூலை 1 முதல் செப்டம்பர் 30 வரைக்குரியவை. அவை காலாண்டுதோறும் மறுஆய்வு செய்யப்படும்."] },
    a5:{ q:"4% ஈட்ட, என் சாதாரணக் கணக்குச் சேமிப்பை மாற்றுங்கள்",
      sum:"சாதாரணக் கணக்கிலிருந்து (2.5%) சிறப்பு அல்லது ஓய்வுக் கணக்கிற்குப் (4%) பணத்தை மாற்றினால் அதிக வட்டி கிடைக்கும். ஆனால் மாற்றம் உடனடியாக நடக்கும்; திரும்பப் பெற முடியாது.",
      pts:["55-க்குக் கீழ், சாதாரணக் கணக்கிலிருந்து சிறப்புக் கணக்கிற்கு மாற்றுவீர்கள். 55 வயதில் உங்கள் சிறப்புக் கணக்கு மூடப்படுவதால், மேம்படுத்தப்பட்ட ஓய்வுத் தொகை வரை ஓய்வுக் கணக்கிற்கு மாற்றுவீர்கள்.","முதலில் வீடு அல்லது பிற தேவைகளுக்குப் போதுமான சாதாரணக் கணக்குச் சேமிப்பை வைத்துக்கொள்ளுங்கள்; ஏனெனில் பணத்தைத் திரும்ப மாற்ற முடியாது.","இணையத்தளத்தில்: Singpass மூலம் உள்நுழைந்து, CPF மாற்றத்தைத் தேர்ந்தெடுத்து, தொகையை உள்ளிட்டு, சரிபார்த்து உறுதிப்படுத்துங்கள்."],
      login:"மாற்றம் செய்ய Singpass தேவை." },
    a6:{ q:"முழு ஓய்வுத் தொகையைச் சீக்கிரம் எட்டுங்கள்",
      sum:"முழு ஓய்வுத் தொகை என்பது ஓய்வுக்காக ஒதுக்கி வைக்க வேண்டிய இயல்புநிலைத் தொகை. 2026-இல் 55 வயதை அடைவோருக்கு அது SGD$220,400; 55 வயதை அடைந்ததும் அது வாழ்நாள் முழுவதும் மாறாது.",
      pts:["55 வயதில், CPF உங்கள் ஓய்வுக் கணக்கைத் திறந்து, முதலில் சிறப்புக் கணக்குச் சேமிப்பையும், பிறகு சாதாரணக் கணக்குச் சேமிப்பையும் முழு ஓய்வுத் தொகை வரை மாற்றும்.","பற்றாக்குறை இருந்தால், தொகை தொடங்கும் முன் ரொக்க டாப்-அப்களும் சாதாரணக் கணக்கு மாற்றங்களும் அந்த இடைவெளியை நிரப்பலாம்.","அதை ஒதுக்கிவிட்டால், அதற்கு மேல் உள்ள சாதாரண, சிறப்புக் கணக்குச் சேமிப்பை எடுக்கலாம்.","சொத்து அடமானம், அடிப்படை ஓய்வுத் தொகையை (2026-இல் SGD$110,200) மட்டும் ஒதுக்க அனுமதிக்கும்; ஆனால் உங்கள் தொகை குறைவாக இருக்கும்."] },
    a7:{ q:"அதிக மாதாந்திரத் தொகைக்காக CPF LIFE தொகையை ஒத்திவையுங்கள்",
      sum:"65 முதல் 70 வயதுக்குள் தொடங்கலாம். நீங்கள் காத்திருக்கும் ஒவ்வோர் ஆண்டுக்கும் உங்கள் மாதாந்திரத் தொகை 7% வரை உயரும்; 70 வயதில் அது 35% வரை அதிகரிக்கலாம்.",
      pts:["CPF எடுத்துக்காட்டு (2026 ஆகஸ்ட்): ஓய்வுக் கணக்கில் SGD$220,400 உள்ள 55 வயது ஆண், நிலையான திட்டத்தில், 65-க்குப் பதிலாக 70 வயதில் தொடங்கினால் மாதத்திற்கு ஏறக்குறைய SGD$600 கூடுதலாகப் பெறுவார்.","நீங்கள் எதுவும் செய்யாவிட்டாலும், 70 வயதில் தொகை தானாகவே தொடங்கும்.","ஒத்திவைக்க அல்லது மீண்டும் தொடங்க “Plan my monthly payouts” சேவையைப் பயன்படுத்துங்கள்."],
      login:"தொடங்கும் வயதை மாற்ற Singpass தேவை." },
    a8:{ q:"மேம்படுத்தப்பட்ட ஓய்வுத் தொகை வரை டாப்-அப் செய்யுங்கள்",
      sum:"55 வயதிலிருந்து, அதிக மாதாந்திரத் தொகைக்காக உங்கள் ஓய்வுக் கணக்கில் மேம்படுத்தப்பட்ட ஓய்வுத் தொகை வரை டாப்-அப் செய்யலாம். அது 2026-இல் SGD$440,800, 2027-இல் SGD$456,400.",
      pts:["2025 முதல் மேம்படுத்தப்பட்ட ஓய்வுத் தொகை, அடிப்படை ஓய்வுத் தொகையின் நான்கு மடங்கு (2024-இல் SGD$308,700, பிறகு 2025-இல் SGD$426,000).","ஓய்வுக் கணக்கு, சிறப்புக் கணக்கின் அதே வட்டியைத் தரும்.","டாப்-அப்களையும் மாற்றங்களையும் திரும்பப் பெற முடியாது. 55-க்குப் பிறகு வீடு, முதலீடு அல்லது பிற தேவைகளுக்காக அவற்றை எடுக்க முடியாது."],
      login:"டாப்-அப் செய்ய Singpass தேவை." },
    a9:{ q:"தொடர்ந்து வேலை செய்யுங்கள் அல்லது அதிகம் ஈட்டுங்கள்",
      sum:"2026 ஜனவரி 1 முதல், மொத்த CPF பங்களிப்பு: 55 வயதும் அதற்குக் கீழும் ஊதியத்தில் 37%, 55-க்கு மேல் 60 வரை 34%, 60-க்கு மேல் 65 வரை 25%, 65-க்கு மேல் 70 வரை 16.5%, 70-க்கு மேல் 12.5%.",
      pts:["55-க்கு மேல் 65 வரை உள்ளவர்களுக்கு 2026-இல் விகிதங்கள் உயர்ந்தன. அந்த உயர்வு, முழு ஓய்வுத் தொகை எட்டப்படும் வரை ஓய்வுக் கணக்கிற்கும், பிறகு சாதாரணக் கணக்கிற்கும் செல்லும்.","55-ம் அதற்குக் கீழும்: முதலாளி 17%, நீங்கள் 20%. 55-க்கு மேல் 60 வரை: முதலாளி 16%, நீங்கள் 18%.","CPF-க்கான மாதாந்திர ஊதிய உச்சவரம்பு 2026 ஜனவரியில் SGD$8,000 ஆக உயர்ந்தது.","இந்த விகிதங்கள் மாதம் SGD$750-க்கு மேற்பட்ட ஊதியத்திற்குப் பொருந்தும்."] },
    a10:{ q:"அரசாங்கத்தின் பொருத்த மானியத்தைப் (MRSS) பெறுங்கள்",
      sum:"நீங்கள் தகுதி பெற்றால், உங்கள் ஓய்வுக் கணக்கில் செய்யும் ரொக்க டாப்-அப்புகளுக்கு அரசாங்கம் டாலருக்கு டாலர் பொருத்தி, ஆண்டுக்கு SGD$2,000 வரை, வாழ்நாள் உச்சவரம்பு SGD$20,000 உடன் வழங்கும்.",
      pts:["ஓய்வுக் கணக்குச் சேமிப்பு குறைவாக உள்ள, 55 வயதும் அதற்கு மேலும் உள்ள சிங்கப்பூர்க் குடிமக்களுக்கு இது. 70 வயது வரம்பு 2025-இல் நீக்கப்பட்டது.","CPF ஆண்டுதோறும் உங்கள் தகுதியைச் சரிபார்க்கும்; எனவே நீங்கள் விண்ணப்பிக்கத் தேவையில்லை. உங்கள் ஓய்வு முகப்புப் பக்கத்தில் அல்லது cpf.gov.sg/checkmrss-இல் பாருங்கள்.","டிசம்பர் 31-க்குள் டாப்-அப் செய்யுங்கள். மானியம் அடுத்த ஆண்டின் தொடக்கத்தில் வரவு வைக்கப்படும்.","பொருத்த மானியம் பெறும் டாப்-அப்களுக்கு வரிக் கழிவு கிடையாது."],
      login:"நீங்கள் தகுதி பெற்றவரா எனப் பார்க்க Singpass மூலம் உள்நுழையுங்கள்." }
  }
};

/* ---------- Chinese ---------- */
Object.assign(TX.zh, {
  s11:{ q:"我会自动加入CPF LIFE吗？谁可以加入？",
    sum:"所有65岁至80岁的公积金会员都可以加入CPF LIFE。没有最低储蓄要求，但您的入息取决于加入时退休账户里的储蓄。",
    pts:["如果您在1958年1月1日或以后出生，而且开始领取入息时有至少SGD$60,000的退休储蓄，您会自动加入（适用于新加坡公民和永久居民）。","如果没有自动加入，您仍然可以选择加入。最迟可在80岁生日前一个月加入。","每月入息估算工具可以显示哪个计划适合您，以及预计入息。"] },
  s12:{ q:"如果我没有加入CPF LIFE呢？",
    sum:"如果没有加入CPF LIFE，您会留在退休总额计划（Retirement Sum Scheme）。您仍然每月领取入息，但储蓄用完后入息就会停止。",
    pts:["入息的计算方式是可领最多20年。储蓄的额外利息有助于延长，最长可到90岁。","您可以在65岁至70岁之间随时开始领取。如果您在1958年以前出生，已过这个年龄，可以随时开始。","您之后仍可加入CPF LIFE，从65岁起到80岁生日前一个月都可以，这样就能终身领取入息。"],
    login:"请用Singpass登录，开始领取入息或加入CPF LIFE。" },
  s13:{ q:"每个月什么时候、怎样领到入息？",
    sum:"公积金局在每月2号扣出您的入息，通常在第4个工作日前存入您的银行户头。如果您的银行支持FAST，可能更早收到。",
    pts:["请向公积金局提供银行户头资料，入息才会存入正确的户头。","如果到70岁您还没有作出指示，入息会在您满70岁那个月自动开始，存入公积金局记录中的银行户头。","如果您延后，公积金局不会补发延后期间的入息。"],
    login:"请用Singpass登录，查看或更新银行户头资料。" },
  s14:{ q:"我的入息会增加或减少吗？",
    sum:"CPF LIFE让您终身领取入息，但入息并非一成不变。公积金局表示，入息每年可能会按利率和会员的寿命等因素调整。",
    pts:["公积金局说，入息的设计是稳定的，预计调整幅度会小而渐进。","收到保单信函后，您有30天可以更改或取消您的计划。","动用更多公积金储蓄来提高入息，是不能撤回的决定。"],
    login:"更改需要使用Singpass。" },
  s15:{ q:"开始领取后，如果我再存钱进退休账户，入息会增加吗？",
    sum:"一般会。自2021年11月起，进入您退休账户的新款项会自动用来增加CPF LIFE保费，让您终身领取更高的入息。",
    pts:["如果是基本计划，当调整后的每月入息至少增加SGD$10时就会这样做。公积金局会通知您新的金额。","如果您从退休账户领取“额外每月入息”（AMP），它不属于CPF LIFE，该账户余额用完就会停止。","为避免AMP结束后收入突然下降，您可以要求公积金局用退休账户余下的储蓄增加CPF LIFE保费。"] },
  s16:{ q:"CPF LIFE入息需要缴税吗？",
    sum:"不需要。新加坡国内税务局（IRAS）说，在新加坡收到的年金一般不用缴税，并以CPF LIFE每月入息为例。",
    pts:["有些年金需要缴税，例如来自生意或合伙业务的年金、补充退休计划（SRS）的提款，或雇主代替退休金购买的保单。CPF LIFE不在其中。","如果您还有其他收入，请向IRAS查询您个人的情况。"] },
  s17:{ q:"我可以不加入CPF LIFE，把储蓄全部提出来吗？",
    sum:"可以，前提是您有其他终身收入来源。公积金局也说，如果您有退休金或私人年金，每月入息与CPF LIFE相同或更高，可以获得豁免。",
    pts:["公积金局网页表示，有其他终身收入来源的人，可以选择不领取每月入息，并提出全部退休储蓄。","CPF LIFE页面说，如果您的退休金或私人年金保证每月入息与CPF LIFE相同或更高，可以申请豁免。","公积金局也建议，可以考虑在其他退休收入之外，加上CPF LIFE的终身入息。"] },
  s18:{ q:"为什么男士和女士的入息不一样？",
    sum:"CPF LIFE是终身入息，所以预期寿命越长，每月入息就越低。女性平均寿命较长，因此储蓄相同的话，男性领取的入息比女性高。",
    pts:["您的入息取决于四项因素：加入时退休账户的余额、开始领取的时间（每延后一年最多增加7%）、公积金利率，以及预期寿命。","所用的利率有4%的底线，另外在您公积金总余额的头SGD$60,000可获最多2%的额外利息。"] },
  s19:{ q:"为什么退休存款额每年都增加？",
    sum:"公积金局给出三个原因：物价上涨、人们寿命更长，以及生活水平提高，所以需要更多储蓄才能在退休后维持同样的生活。",
    pts:["如果您已经满55岁，每年的增加不会影响您。您的基本和全额退休存款额，由您满55岁那一年决定，终身不变。","公积金局举例：全额退休存款额在1987年是SGD$30,000。如果一直不变，今天每月只能领取约SGD$300。"] },
  s20:{ q:"我在CPF LIFE里的钱安全吗？",
    sum:"CPF LIFE的储蓄由新加坡政府担保。公积金局也保证，您终身领取的入息加上付给受益人的款项，总额不会少于您的CPF LIFE保费。",
    pts:["您的保费享有最高每年6%的公积金利息，没有风险，并计入您的入息。","CPF LIFE是保险计划，不是投资产品。它是非营利的，由公积金局管理。","CPF LIFE靠分担风险运作：剩余保费的利息汇集起来，让所有会员都能终身领取入息。"] },
  a11:{ q:"为医疗储蓄账户增存",
    sum:"您可以用现金为自己或亲人的医疗储蓄账户增存，每年最多可获SGD$8,000的税务减免。这SGD$8,000与您为特别账户或退休账户增存的减免共用。",
    pts:["医疗储蓄账户最多可收到的金额，是基本医疗保健额减去目前的余额。2026年65岁以下会员的基本医疗保健额是SGD$79,000。","增存到医疗储蓄账户不能撤回或退款。如果超过上限，多出的部分会不计利息退还给您。","自2026年1月1日起，符合资格的会员为医疗储蓄增存，每年可获最多SGD$1,000的配对津贴。获得配对的增存不享有税务减免。","要为配偶或兄弟姐妹增存并享有税务减免，对方上一年的收入须在SGD$8,000或以下，或者是残障人士。"],
    login:"增存需要使用Singpass。" },
  a12:{ q:"用GIRO设置小额定期增存",
    sum:"您不需要一次过大额增存。您可以用GIRO设置小额的定期现金增存，这样就不必每次都填表。",
    pts:["分两步：先与银行设置GIRO，再提交定期现金增存申请。两步都要完成。","55岁及以上的会员，还可以设置每月从普通账户转小额款项到自己的退休账户。","要更改定期安排，请删除后重新设置。","增存不能撤回，通常在公积金局收到款项后7个工作日内存入。"],
    login:"设置需要使用Singpass。" },
  a13:{ q:"年初增存，赚取更多利息",
    sum:"每年在1月而不是12月增存，10年内您的增存最多可多赚20%的利息，因为公积金利息按月计算，并会滚存。",
    pts:["公积金局的例子假设利率底线4%、头SGD$60,000最多2%的额外利息、每年增存SGD$8,000，起始余额为零。","请尽早在年初增存，确保在年底前处理完毕。12月申请的人多，处理时间可能较长。","公积金局建议在普通账户保留至少SGD$20,000，应付日后需要，并享有额外1%的利息。"] },
  a14:{ q:"了解您的公积金缴款去了哪里",
    sum:"您的公积金缴款会按年龄分配到普通账户、特别账户（或退休账户）和医疗储蓄账户。了解分配比例，有助于决定该增存哪个账户。",
    pts:["35岁及以下：约62%存入普通账户，16%存入特别账户，22%存入医疗储蓄。35岁以上至45岁：约57%、19%和24%。","随着年龄增加，存入退休和医疗储蓄的比例会提高。55岁以上至60岁：约35%普通账户、34%退休账户、31%医疗储蓄。","从55岁起，您的缴款会先存入退休账户，直到全额退休存款额为止。"] },
  a15:{ q:"用公积金投资计划投资",
    sum:"公积金投资计划（CPFIS）让您把部分普通账户和特别账户的储蓄，投资在风险程度不同的产品。如果您选择不投资，储蓄仍会赚取无风险的公积金利息。",
    pts:["您可以在普通账户预留SGD$20,000后，投资其余的储蓄；特别账户则要预留SGD$40,000。","用普通账户的储蓄，最多可把可投资储蓄的35%投资在股票，10%投资在黄金。","公积金局提醒，只有在您有信心赚得比无风险公积金利息更多时才投资。公积金投资计划的投资不在公积金提名的涵盖范围内。"] },
  a16:{ q:"如果您在1973年或以前出生，请查看Majulah配套",
    sum:"Majulah配套（Majulah Package）为1973年或以前出生的新加坡公民提供支持。其中的“赚与存奖励”会为符合资格的在职乐龄人士，每年增加SGD$400至SGD$1,000的公积金，收入较低者可获更多。",
    pts:["配套也包括一次过的退休储蓄奖励（最多SGD$1,500），给公积金退休储蓄较少的人；以及医疗储蓄奖励（最多SGD$2,000）。","1973年或以前出生的新加坡人，都至少会获得配套的一个部分。","人力部网页说明了谁符合资格，以及款项何时存入。请查看哪些适用于您。"] },
  a17:{ q:"自雇或自由工作者？自己建立公积金",
    sum:"如果您是自雇人士，而且每年净贸易收入超过SGD$6,000，您必须缴交医疗储蓄。没有雇主替您缴交。",
    pts:["即使医疗储蓄已达到基本医疗保健额，您仍须缴交。超出该额的医疗储蓄，会先转入您的特别账户或退休账户，再转入普通账户。","您也可以根据公积金自雇计划自愿缴款，增加退休和住房储蓄。","缴交医疗储蓄和自愿缴款，可能获得税务减免。IRAS网页有详细规定。"] },
  a18:{ q:"了解花红如何计入公积金",
    sum:"花红和其他额外薪金属于额外工资。每年计入公积金的额外工资有上限：SGD$102,000减去当年已缴公积金的普通工资。",
    pts:["例子：如果您已缴公积金的普通工资是SGD$96,000（每月SGD$8,000），那么您的花红只有SGD$6,000需要缴公积金。","这个上限按每名雇主、每个日历年计算。","如果花红超过上限，超出部分不用缴公积金。用现金为特别账户或退休账户增存，是把这笔钱加入退休储蓄的方法之一。"] },
  a19:{ q:"聪明地用公积金买房",
    sum:"出售用公积金购买的房屋时，您要把动用的公积金，连同这笔钱本来可赚的利息，退回您自己的公积金账户。所以这笔钱仍然是您的退休储蓄。",
    pts:["如果卖房所得在还清贷款后，不够退回全部款项，只要房屋以市价出售，您不需要补足差额。","如果您已超过55岁，退回的款项会用来补足退休账户的全额退休存款额，让您领取更高的每月入息。","所欠的利息，是这些钱留在普通账户本来可赚的利息。普通账户的利率是每年2.5%。"] },
  a20:{ q:"收入较低？领取职工收入补助（WIS）",
    sum:"职工收入补助（Workfare Income Supplement）为低收入工友增加收入和公积金储蓄。如果您是雇员，补助的60%会存入公积金，40%以现金发放。",
    pts:["2025工作年度每年最高补助：30至34岁SGD$2,450，35至44岁SGD$3,500，45至59岁SGD$4,200，60岁及以上SGD$4,900。","如果您是自雇人士，10%以现金发放，90%存入医疗储蓄账户。","可使用公积金局的网上WIS计算器，估算您能领取的金额。"] }
});

Object.assign(TX.ms, {
  s11:{ q:"Adakah saya terus masuk CPF LIFE, dan siapa boleh menyertai?",
    sum:"Semua ahli CPF berumur 65 hingga 80 tahun boleh menyertai CPF LIFE. Tiada simpanan minimum, tetapi bayaran anda bergantung pada baki Akaun Persaraan anda semasa menyertai.",
    pts:["Anda dimasukkan secara automatik jika dilahirkan pada atau selepas 1 Januari 1958 dan mempunyai sekurang-kurangnya SGD$60,000 simpanan persaraan apabila bayaran bermula (Warganegara dan Penduduk Tetap Singapura).","Jika tidak dimasukkan secara automatik, anda masih boleh memilih untuk menyertai. Umur terakhir untuk menyertai ialah sebulan sebelum anda berumur 80 tahun.","Penganggar bayaran bulanan menunjukkan pelan yang sesuai dan anggaran bayaran anda."] },
  s12:{ q:"Bagaimana jika saya tidak berada dalam CPF LIFE?",
    sum:"Jika anda tidak dalam CPF LIFE, anda kekal dalam Skim Jumlah Persaraan (Retirement Sum Scheme). Anda masih menerima bayaran bulanan, tetapi ia berhenti apabila simpanan persaraan anda habis.",
    pts:["Bayaran anda dikira untuk bertahan sehingga 20 tahun. Faedah tambahan atas simpanan anda membantu melanjutkannya, sehingga umur 90 tahun.","Anda boleh mula bila-bila masa antara umur 65 hingga 70 tahun. Jika dilahirkan sebelum 1958, anda sudah melepasi umur itu dan boleh mula bila-bila masa.","Anda boleh menyertai CPF LIFE kemudian, bila-bila masa dari umur 65 sehingga sebulan sebelum berumur 80 tahun, untuk mendapat bayaran seumur hidup."],
    login:"Log masuk dengan Singpass untuk memulakan bayaran atau menyertai CPF LIFE." },
  s13:{ q:"Bila dan bagaimana saya dibayar setiap bulan?",
    sum:"CPF mengeluarkan bayaran anda pada 2 haribulan, dan biasanya ia masuk ke akaun bank anda menjelang hari bekerja ke-4. Ia mungkin tiba lebih awal jika bank anda menyokong FAST.",
    pts:["Berikan butiran akaun bank anda kepada CPF supaya bayaran masuk ke akaun yang betul.","Jika anda tidak memberi arahan menjelang umur 70, bayaran bermula secara automatik pada bulan anda berumur 70 dan masuk ke akaun bank yang ada dalam rekod CPF.","Jika anda menangguh, CPF tidak membuat bayaran balik untuk bulan-bulan yang anda tunggu."],
    login:"Log masuk dengan Singpass untuk menyemak atau mengemas kini butiran akaun bank anda." },
  s14:{ q:"Bolehkah bayaran saya naik atau turun?",
    sum:"CPF LIFE membayar anda seumur hidup, tetapi bayaran tidak tetap selamanya. CPF berkata bayaran bulanan boleh dilaraskan setiap tahun mengikut faktor seperti kadar faedah dan jangka hayat ahli.",
    pts:["CPF berkata bayaran direka supaya stabil, dan pelarasan dijangka kecil serta beransur-ansur.","Selepas menerima surat polisi, anda mempunyai 30 hari untuk menukar atau membatalkan pelan anda.","Menggunakan lebih banyak simpanan CPF untuk menaikkan bayaran anda ialah keputusan yang tidak boleh dibatalkan."],
    login:"Anda memerlukan Singpass untuk membuat perubahan." },
  s15:{ q:"Jika saya menambah wang ke Akaun Persaraan selepas bayaran bermula, adakah bayaran saya naik?",
    sum:"Biasanya ya. Sejak November 2021, wang baru yang masuk ke Akaun Persaraan anda digunakan secara automatik untuk menaikkan premium CPF LIFE anda, jadi anda menerima bayaran lebih tinggi seumur hidup.",
    pts:["Pada Pelan Asas, ini berlaku apabila bayaran bulanan yang disemak naik sekurang-kurangnya SGD$10. CPF akan memberitahu anda jumlah baru.","Jika anda menerima Bayaran Bulanan Tambahan (AMP) daripada Akaun Persaraan, ia bukan sebahagian daripada CPF LIFE dan berhenti apabila baki itu habis.","Untuk mengelakkan pendapatan anda turun mendadak apabila AMP tamat, anda boleh meminta CPF menggunakan baki simpanan Akaun Persaraan anda untuk menaikkan premium CPF LIFE."] },
  s16:{ q:"Adakah saya membayar cukai ke atas bayaran CPF LIFE?",
    sum:"Tidak. IRAS berkata anuiti yang diterima di Singapura umumnya tidak dikenakan cukai, dan menyebut bayaran bulanan CPF LIFE sebagai contoh.",
    pts:["Sesetengah anuiti dikenakan cukai, seperti yang datang daripada perniagaan atau perkongsian, pengeluaran Skim Persaraan Tambahan (SRS), atau polisi yang dibeli majikan sebagai ganti pencen. CPF LIFE bukan salah satunya.","Jika anda mempunyai pendapatan lain, semak dengan IRAS untuk keadaan anda sendiri."] },
  s17:{ q:"Bolehkah saya tidak menyertai CPF LIFE dan mengeluarkan simpanan saya?",
    sum:"Boleh, jika anda mempunyai sumber pendapatan seumur hidup yang lain. CPF juga berkata anda boleh dikecualikan jika anda mempunyai pencen atau anuiti swasta yang membayar jumlah bulanan yang sama atau lebih tinggi daripada CPF LIFE.",
    pts:["Halaman CPF berkata anda boleh memilih untuk tidak menerima bayaran bulanan dan mengeluarkan semua simpanan persaraan jika anda mempunyai sumber pendapatan seumur hidup yang lain.","Halaman CPF LIFE berkata anda boleh dikecualikan jika pencen atau anuiti swasta anda menjamin bayaran bulanan yang sama atau lebih tinggi.","CPF juga mencadangkan anda mempertimbangkan CPF LIFE sebagai tambahan kepada pendapatan persaraan anda yang lain."] },
  s18:{ q:"Mengapa bayaran lelaki dan perempuan berbeza?",
    sum:"CPF LIFE membayar seumur hidup, jadi jangka hayat yang lebih panjang bermakna bayaran bulanan yang lebih rendah. Wanita secara purata hidup lebih lama, jadi dengan simpanan yang sama, lelaki menerima bayaran lebih tinggi daripada wanita.",
    pts:["Bayaran anda dikira daripada empat perkara: baki Akaun Persaraan semasa anda menyertai, bila anda bermula (sehingga 7% lebih bagi setiap tahun anda menangguh), kadar faedah CPF, dan jangka hayat.","Kadar faedah yang digunakan mempunyai paras terendah 4%, serta faedah tambahan sehingga 2% atas SGD$60,000 pertama baki CPF gabungan anda."] },
  s19:{ q:"Mengapa Jumlah Persaraan naik setiap tahun?",
    sum:"CPF memberi tiga sebab: harga naik, orang hidup lebih lama, dan taraf hidup bertambah baik, jadi lebih banyak simpanan diperlukan untuk gaya hidup yang sama semasa bersara.",
    pts:["Jika anda sudah berumur 55 tahun, kenaikan tahunan tidak menjejaskan anda. Jumlah Persaraan Asas dan Penuh anda ditetapkan seumur hidup mengikut tahun anda berumur 55.","Contoh CPF: Jumlah Persaraan Penuh ialah SGD$30,000 pada 1987. Jika kekal di situ, ia hanya memberi kira-kira SGD$300 sebulan hari ini."] },
  s20:{ q:"Adakah wang saya dalam CPF LIFE selamat?",
    sum:"Simpanan CPF LIFE dijamin oleh Kerajaan Singapura. CPF juga menjamin bahawa jumlah bayaran yang anda terima ditambah dengan apa yang dibayar kepada benefisiari anda tidak kurang daripada premium CPF LIFE anda.",
    pts:["Premium anda memperoleh faedah CPF sehingga 6% setahun, tanpa risiko, dan ini diambil kira dalam bayaran anda.","CPF LIFE ialah skim insurans, bukan pelaburan. Ia tidak berorientasikan keuntungan dan ditadbir oleh Lembaga CPF.","CPF LIFE berfungsi dengan mengumpulkan risiko: faedah atas baki premium dikumpulkan supaya semua ahli menerima bayaran selagi mereka hidup."] },
  a11:{ q:"Tokok Akaun MediSave saya",
    sum:"Anda boleh menokok Akaun MediSave anda atau orang tersayang secara tunai dan menuntut pelepasan cukai sehingga SGD$8,000 setahun. SGD$8,000 ini dikongsi dengan tokokan anda ke Akaun Khas atau Persaraan.",
    pts:["Jumlah paling banyak yang boleh diterima Akaun MediSave ialah Jumlah Penjagaan Kesihatan Asas tolak baki semasa. Jumlah itu SGD$79,000 pada 2026 bagi ahli di bawah 65 tahun.","Tokokan ke MediSave tidak boleh dibatalkan atau dikembalikan. Jika melebihi had, lebihannya dikembalikan kepada anda tanpa faedah.","Mulai 1 Januari 2026, ahli yang layak mendapat geran padanan sehingga SGD$1,000 setahun atas tokokan MediSave. Tokokan yang dipadankan tidak mendapat pelepasan cukai.","Bagi pasangan atau adik-beradik menerima tokokan anda dengan pelepasan cukai, pendapatan mereka pada tahun sebelumnya mesti SGD$8,000 atau kurang, atau mereka cacat."],
    login:"Anda memerlukan Singpass untuk membuat tokokan." },
  a12:{ q:"Sediakan tokokan tetap kecil melalui GIRO",
    sum:"Anda tidak perlu menokok dalam satu jumlah besar. Anda boleh menyediakan tokokan tunai berulang yang kecil melalui GIRO, supaya tidak perlu mengisi borang setiap kali.",
    pts:["Ia dua langkah: sediakan GIRO dengan bank anda, kemudian hantar permintaan tokokan tunai berulang untuk persaraan. Kedua-dua langkah mesti dibuat.","Ahli berumur 55 tahun ke atas juga boleh menyediakan pindahan bulanan kecil daripada Akaun Biasa ke Akaun Persaraan sendiri.","Untuk menukar susunan berulang, padamkannya dan buat yang baru.","Tokokan tidak boleh dibatalkan dan biasanya dikreditkan dalam 7 hari bekerja selepas CPF menerima bayaran."],
    login:"Anda memerlukan Singpass untuk membuat penyediaan." },
  a13:{ q:"Tokok awal tahun untuk faedah lebih banyak",
    sum:"Menokok pada Januari dan bukan Disember setiap tahun boleh memperoleh sehingga 20% lebih faedah atas tokokan anda dalam 10 tahun, kerana faedah CPF dikira setiap bulan dan berganda.",
    pts:["Contoh CPF mengandaikan paras terendah faedah 4%, faedah tambahan sehingga 2% atas SGD$60,000 pertama, tokokan SGD$8,000 setahun dan baki permulaan SGD$0.","Tokok awal tahun supaya diproses sebelum akhir tahun. Pemprosesan boleh lebih lama pada Disember apabila ramai memohon.","CPF mencadangkan anda mengekalkan sekurang-kurangnya SGD$20,000 dalam Akaun Biasa untuk keperluan akan datang dan faedah tambahan 1%."] },
  a14:{ q:"Ketahui ke mana caruman CPF anda pergi",
    sum:"Caruman CPF anda dibahagikan antara akaun Biasa, Khas (atau Persaraan) dan MediSave mengikut umur. Mengetahui pembahagian ini membantu anda memutuskan akaun mana yang hendak ditokok.",
    pts:["Umur 35 tahun ke bawah: kira-kira 62% ke Akaun Biasa, 16% ke Akaun Khas dan 22% ke MediSave. Lebih 35 hingga 45: kira-kira 57%, 19% dan 24%.","Bahagian untuk persaraan dan MediSave meningkat apabila anda semakin tua. Lebih 55 hingga 60: kira-kira 35% Biasa, 34% Persaraan dan 31% MediSave.","Dari umur 55, caruman anda masuk ke Akaun Persaraan dahulu, sehingga Jumlah Persaraan Penuh."] },
  a15:{ q:"Labur CPF saya dengan Skim Pelaburan CPF",
    sum:"CPFIS membolehkan anda melabur sebahagian simpanan Akaun Biasa dan Akaun Khas dalam produk dengan tahap risiko berbeza. Simpanan CPF anda terus memperoleh faedah tanpa risiko jika anda memilih untuk tidak melabur.",
    pts:["Anda boleh melabur simpanan Akaun Biasa selepas mengetepikan SGD$20,000, dan simpanan Akaun Khas selepas mengetepikan SGD$40,000.","Daripada Akaun Biasa, anda boleh melabur sehingga 35% simpanan boleh laburan dalam saham dan 10% dalam emas.","CPF berkata labur hanya apabila anda yakin dapat mengatasi faedah CPF tanpa risiko, dan pelaburan CPFIS tidak dilindungi oleh penamaan CPF."] },
  a16:{ q:"Semak Pakej Majulah jika anda dilahirkan pada 1973 atau lebih awal",
    sum:"Pakej Majulah menyokong Warganegara Singapura yang dilahirkan pada 1973 atau lebih awal. Bonus Earn and Save memberi warga emas bekerja yang layak tokokan CPF SGD$400 hingga SGD$1,000 setahun, dengan pekerja berpendapatan lebih rendah mendapat lebih.",
    pts:["Ia juga mempunyai Bonus Simpanan Persaraan sekali sahaja (sehingga SGD$1,500) untuk mereka yang simpanan persaraan CPFnya lebih rendah, dan Bonus MediSave (sehingga SGD$2,000).","Setiap rakyat Singapura yang dilahirkan pada 1973 atau lebih awal mendapat sekurang-kurangnya satu bahagian pakej.","Halaman MOM menjelaskan siapa yang layak dan bila wang dikreditkan. Semak apa yang terpakai kepada anda."] },
  a17:{ q:"Bekerja sendiri atau pekerja bebas? Bina CPF anda sendiri",
    sum:"Jika anda bekerja sendiri dan pendapatan perdagangan bersih anda melebihi SGD$6,000 setahun, anda mesti mencarum ke MediSave. Tiada majikan yang melakukannya untuk anda.",
    pts:["Anda mesti terus mencarum ke MediSave walaupun sudah mencapai Jumlah Penjagaan Kesihatan Asas. Simpanan MediSave melebihi jumlah itu mengalir ke Akaun Khas atau Persaraan dahulu, kemudian ke Akaun Biasa.","Anda juga boleh membuat caruman sukarela di bawah Skim Bekerja Sendiri CPF untuk membina simpanan persaraan dan perumahan.","Caruman MediSave dan caruman sukarela mungkin mendapat pelepasan cukai. IRAS menerangkan peraturannya."] },
  a18:{ q:"Ketahui bagaimana bonus dikira untuk CPF",
    sum:"Bonus dan gaji tambahan lain dikira sebagai Gaji Tambahan. Jumlah yang dikenakan CPF dihadkan setiap tahun: SGD$102,000 tolak Gaji Biasa yang dikenakan CPF pada tahun itu.",
    pts:["Contoh: jika Gaji Biasa anda yang dikenakan CPF ialah SGD$96,000 (SGD$8,000 sebulan), hanya SGD$6,000 bonus anda dikenakan CPF.","Had ini terpakai bagi setiap majikan setiap tahun kalendar.","Jika bonus anda melebihi had, lebihannya tidak dikenakan CPF. Tokokan tunai ke Akaun Khas atau Persaraan ialah satu cara untuk menambahnya ke simpanan persaraan anda."] },
  a19:{ q:"Gunakan CPF untuk rumah anda dengan bijak",
    sum:"Apabila anda menjual rumah yang dibeli dengan CPF, anda mengembalikan CPF yang digunakan, serta faedah yang akan diperoleh wang itu, ke akaun CPF anda sendiri. Jadi wang itu kekal milik anda untuk persaraan.",
    pts:["Jika hasil jualan, selepas menjelaskan pinjaman, tidak cukup untuk memulangkan semuanya, anda tidak perlu menampung bezanya, selagi rumah dijual pada harga pasaran.","Jika anda berumur lebih 55 tahun, bayaran balik digunakan untuk Jumlah Persaraan Penuh dalam Akaun Persaraan anda, yang memberi bayaran bulanan lebih tinggi.","Faedah itu ialah apa yang akan diperoleh simpanan Akaun Biasa anda. Akaun Biasa membayar 2.5% setahun."] },
  a20:{ q:"Dapatkan Tambahan Pendapatan Workfare jika gaji anda lebih rendah",
    sum:"Tambahan Pendapatan Workfare (WIS) menambah pendapatan dan simpanan CPF pekerja berpendapatan lebih rendah. Jika anda pekerja, 60% WIS anda masuk ke CPF dan 40% dibayar tunai.",
    pts:["Untuk Tahun Kerja 2025, jumlah paling banyak setahun ialah SGD$2,450 (umur 30 hingga 34), SGD$3,500 (35 hingga 44), SGD$4,200 (45 hingga 59) dan SGD$4,900 (60 ke atas).","Jika anda bekerja sendiri, 10% dibayar tunai dan 90% masuk ke Akaun MediSave anda.","Gunakan kalkulator WIS dalam talian CPF untuk menganggar jumlah yang mungkin anda terima."] }
});

Object.assign(TX.ta, {
  s11:{ q:"நான் தானாகவே CPF LIFE-இல் சேர்க்கப்படுவேனா? யார் சேரலாம்?",
    sum:"65 முதல் 80 வயது வரையுள்ள அனைத்து CPF உறுப்பினர்களும் CPF LIFE-இல் சேரலாம். குறைந்தபட்ச சேமிப்பு இல்லை; ஆனால் உங்கள் தொகை, சேரும்போது உங்கள் ஓய்வுக் கணக்கில் உள்ள தொகையைப் பொறுத்தது.",
    pts:["நீங்கள் 1958 ஜனவரி 1 அல்லது அதற்குப் பின் பிறந்து, தொகை தொடங்கும்போது குறைந்தது SGD$60,000 ஓய்வுச் சேமிப்பு இருந்தால், தானாகவே சேர்க்கப்படுவீர்கள் (சிங்கப்பூர்க் குடிமக்கள், நிரந்தரவாசிகள்).","தானாகச் சேர்க்கப்படாவிட்டாலும், நீங்கள் விரும்பினால் சேரலாம். சேர்வதற்கான கடைசி வயது, உங்களுக்கு 80 வயது ஆவதற்கு ஒரு மாதம் முன்பு.","மாதாந்திரத் தொகை மதிப்பீட்டுக் கருவி, எந்தத் திட்டம் உங்களுக்குப் பொருந்தும் என்பதையும் மதிப்பிடப்பட்ட தொகையையும் காட்டும்."] },
  s12:{ q:"நான் CPF LIFE-இல் இல்லையென்றால் என்ன?",
    sum:"நீங்கள் CPF LIFE-இல் இல்லையென்றால், ஓய்வுத் தொகைத் திட்டத்தில் (Retirement Sum Scheme) இருப்பீர்கள். மாதாந்திரத் தொகை கிடைக்கும்; ஆனால் ஓய்வுச் சேமிப்பு தீர்ந்ததும் அது நின்றுவிடும்.",
    pts:["உங்கள் தொகை 20 ஆண்டுகள் வரை நீடிக்கும்படி கணக்கிடப்படுகிறது. சேமிப்பின் கூடுதல் வட்டி அதை 90 வயது வரை நீட்டிக்க உதவும்.","65 முதல் 70 வயதுக்குள் எப்போது வேண்டுமானாலும் தொடங்கலாம். நீங்கள் 1958-க்கு முன் பிறந்தவராக இருந்தால், அந்த வயதைக் கடந்துவிட்டதால் எப்போது வேண்டுமானாலும் தொடங்கலாம்.","வாழ்நாள் முழுவதும் தொகை பெற, 65 வயது முதல் 80 வயதுக்கு ஒரு மாதம் முன்பு வரை எப்போது வேண்டுமானாலும் பின்னர் CPF LIFE-இல் சேரலாம்."],
    login:"தொகையைத் தொடங்க அல்லது CPF LIFE-இல் சேர Singpass மூலம் உள்நுழையுங்கள்." },
  s13:{ q:"ஒவ்வொரு மாதமும் எப்போது, எப்படிப் பணம் கிடைக்கும்?",
    sum:"உங்கள் தொகை மாதத்தின் 2-ஆம் தேதி எடுக்கப்பட்டு, பொதுவாக 4-ஆவது வேலை நாளுக்குள் உங்கள் வங்கிக் கணக்கில் வரும். உங்கள் வங்கி FAST-ஐ ஆதரித்தால் முன்கூட்டியே வரலாம்.",
    pts:["சரியான கணக்கிற்குத் தொகை செல்ல, உங்கள் வங்கிக் கணக்கு விவரங்களை CPF-க்குக் கொடுங்கள்.","70 வயதுக்குள் நீங்கள் அறிவுறுத்தல் தராவிட்டால், உங்களுக்கு 70 வயதாகும் மாதத்தில் தொகை தானாகத் தொடங்கி, CPF-இன் பதிவில் உள்ள வங்கிக் கணக்கிற்குச் செல்லும்.","நீங்கள் ஒத்திவைத்தால், காத்திருந்த மாதங்களுக்கான தொகையை CPF பின்னர் வழங்காது."],
    login:"உங்கள் வங்கிக் கணக்கு விவரங்களைப் பார்க்க அல்லது புதுப்பிக்க Singpass மூலம் உள்நுழையுங்கள்." },
  s14:{ q:"என் தொகை கூடலாமா அல்லது குறையலாமா?",
    sum:"CPF LIFE வாழ்நாள் முழுவதும் தொகை தரும்; ஆனால் தொகை என்றென்றும் ஒரே அளவில் இராது. வட்டி விகிதங்கள், உறுப்பினர்களின் ஆயுட்காலம் போன்றவற்றுக்கேற்ப மாதாந்திரத் தொகை ஆண்டுதோறும் சரிசெய்யப்படலாம் என்று CPF கூறுகிறது.",
    pts:["தொகை நிலையாக இருக்கும்படி வடிவமைக்கப்பட்டுள்ளது; சரிசெய்தல்கள் சிறியதாகவும் படிப்படியாகவும் இருக்கும் என்று எதிர்பார்க்கப்படுகிறது.","உங்கள் பாலிசிக் கடிதம் கிடைத்த பின் உங்கள் திட்டத்தை மாற்ற அல்லது ரத்து செய்ய 30 நாட்கள் உண்டு.","தொகையை உயர்த்த அதிக CPF சேமிப்பைப் பயன்படுத்தும் முடிவை மீண்டும் மாற்ற முடியாது."],
    login:"மாற்றங்களைச் செய்ய Singpass தேவை." },
  s15:{ q:"தொகை தொடங்கிய பின் ஓய்வுக் கணக்கில் பணம் சேர்த்தால், என் தொகை உயருமா?",
    sum:"பொதுவாக ஆம். 2021 நவம்பர் முதல், உங்கள் ஓய்வுக் கணக்கில் வரும் புதிய தொகை தானாகவே உங்கள் CPF LIFE பிரீமியத்தை உயர்த்தப் பயன்படுகிறது; எனவே வாழ்நாள் முழுவதும் அதிகத் தொகை கிடைக்கும்.",
    pts:["அடிப்படைத் திட்டத்தில், திருத்தப்பட்ட மாதாந்திரத் தொகை குறைந்தது SGD$10 உயர்ந்தால் இது நடக்கும். புதிய தொகையை CPF உங்களுக்குத் தெரிவிக்கும்.","உங்கள் ஓய்வுக் கணக்கிலிருந்து கூடுதல் மாதாந்திரத் தொகை (AMP) பெற்றால், அது CPF LIFE-இன் பகுதி அல்ல; அந்த இருப்பு தீர்ந்ததும் நின்றுவிடும்.","AMP முடியும்போது உங்கள் வருமானம் திடீரெனக் குறையாமல் இருக்க, ஓய்வுக் கணக்கில் மீதமுள்ள சேமிப்பால் CPF LIFE பிரீமியத்தை உயர்த்தும்படி CPF-இடம் கேட்கலாம்."] },
  s16:{ q:"CPF LIFE தொகைக்கு நான் வரி செலுத்த வேண்டுமா?",
    sum:"இல்லை. சிங்கப்பூரில் பெறப்படும் ஆண்டுத்தொகைகளுக்கு (annuities) பொதுவாக வரி இல்லை என்று IRAS கூறுகிறது; CPF LIFE மாதாந்திரத் தொகையை அது எடுத்துக்காட்டாகக் குறிப்பிடுகிறது.",
    pts:["சில ஆண்டுத்தொகைகளுக்கு வரி உண்டு; எ.கா. வணிகம் அல்லது கூட்டாண்மையிலிருந்து வருபவை, துணை ஓய்வுத் திட்டம் (SRS) பணம் எடுப்பு, அல்லது ஓய்வூதியத்துக்குப் பதிலாக முதலாளி வாங்கிய பாலிசி. CPF LIFE அவற்றில் ஒன்றல்ல.","உங்களுக்கு வேறு வருமானம் இருந்தால், உங்கள் நிலைக்கு IRAS-இடம் சரிபார்க்கவும்."] },
  s17:{ q:"CPF LIFE-இல் சேராமல் என் சேமிப்பு முழுவதையும் எடுக்க முடியுமா?",
    sum:"முடியும், உங்களுக்கு வேறு வாழ்நாள் வருமான ஆதாரம் இருந்தால். CPF LIFE-க்குச் சமமான அல்லது அதிகமான மாதாந்திரத் தொகை தரும் ஓய்வூதியம் அல்லது தனியார் ஆண்டுத்தொகை இருந்தால் விலக்கு பெறலாம் என்றும் CPF கூறுகிறது.",
    pts:["வேறு வாழ்நாள் வருமான ஆதாரம் இருந்தால், மாதாந்திரத் தொகையைப் பெறாமல் ஓய்வுச் சேமிப்பு முழுவதையும் எடுக்கலாம் என்று CPF பக்கம் கூறுகிறது.","உங்கள் ஓய்வூதியம் அல்லது தனியார் ஆண்டுத்தொகை CPF LIFE-க்குச் சமமான அல்லது அதிகமான மாதாந்திரத் தொகையை உறுதிசெய்தால் விலக்கு பெறலாம் என்று CPF LIFE பக்கம் கூறுகிறது.","உங்கள் மற்ற ஓய்வு வருமானத்துடன் கூடுதலாக CPF LIFE-ஐப் பரிசீலிக்கவும் CPF பரிந்துரைக்கிறது."] },
  s18:{ q:"ஆண்களுக்கும் பெண்களுக்கும் தொகை ஏன் வேறுபடுகிறது?",
    sum:"CPF LIFE வாழ்நாள் முழுவதும் தருவதால், ஆயுட்காலம் அதிகமாக இருந்தால் மாதாந்திரத் தொகை குறைவாக இருக்கும். பெண்கள் சராசரியாக நீண்ட காலம் வாழ்வதால், அதே சேமிப்புக்கு ஆண்களுக்குப் பெண்களை விட அதிகத் தொகை கிடைக்கும்.",
    pts:["உங்கள் தொகை நான்கு விஷயங்களால் தீர்மானிக்கப்படுகிறது: சேரும்போது ஓய்வுக் கணக்கு இருப்பு, தொடங்கும் நேரம் (ஒத்திவைக்கும் ஒவ்வோர் ஆண்டுக்கும் 7% வரை கூடுதல்), CPF வட்டி விகிதங்கள், ஆயுட்காலம்.","பயன்படுத்தப்படும் வட்டிக்கு 4% அடிப்படை உண்டு; உங்கள் ஒருங்கிணைந்த CPF இருப்பின் முதல் SGD$60,000-க்கு 2% வரை கூடுதல் வட்டியும் உண்டு."] },
  s19:{ q:"ஓய்வுத் தொகை ஏன் ஆண்டுதோறும் உயர்கிறது?",
    sum:"CPF மூன்று காரணங்களைக் கூறுகிறது: விலைகள் உயர்கின்றன, மக்கள் நீண்ட காலம் வாழ்கிறார்கள், வாழ்க்கைத் தரம் உயர்கிறது. எனவே ஓய்வுக் காலத்தில் அதே வாழ்க்கைக்கு அதிகச் சேமிப்பு தேவை.",
    pts:["நீங்கள் ஏற்கெனவே 55 வயதை அடைந்திருந்தால், ஆண்டுதோறும் ஏற்படும் உயர்வு உங்களைப் பாதிக்காது. உங்கள் அடிப்படை, முழு ஓய்வுத் தொகைகள் 55 வயதை அடையும் ஆண்டால் வாழ்நாள் முழுவதும் நிர்ணயிக்கப்படும்.","CPF தரும் எடுத்துக்காட்டு: முழு ஓய்வுத் தொகை 1987-இல் SGD$30,000. அது அப்படியே இருந்திருந்தால், இன்று மாதத்திற்கு சுமார் SGD$300 மட்டுமே தரும்."] },
  s20:{ q:"CPF LIFE-இல் உள்ள என் பணம் பாதுகாப்பானதா?",
    sum:"CPF LIFE சேமிப்புக்கு சிங்கப்பூர் அரசாங்கம் உத்தரவாதம் அளிக்கிறது. நீங்கள் பெறும் மொத்தத் தொகையும் உங்கள் பயனாளிகளுக்குச் செலுத்தப்படுவதும் சேர்ந்து, உங்கள் CPF LIFE பிரீமியத்துக்குக் குறையாது என்றும் CPF உறுதியளிக்கிறது.",
    pts:["உங்கள் பிரீமியத்துக்கு ஆண்டுக்கு 6% வரை, ஆபத்தின்றி, CPF வட்டி கிடைக்கும்; அது உங்கள் தொகையில் சேர்க்கப்படுகிறது.","CPF LIFE ஒரு காப்புறுதித் திட்டம், முதலீடு அல்ல. இது இலாப நோக்கற்றது; CPF வாரியம் நிர்வகிக்கிறது.","CPF LIFE ஆபத்தைப் பகிர்ந்து செயல்படுகிறது: மீதமுள்ள பிரீமியத்தின் வட்டி ஒன்றுதிரட்டப்பட்டு, எல்லா உறுப்பினர்களும் வாழும் வரை தொகை பெற உதவுகிறது."] },
  a11:{ q:"என் மெடிசேவ் கணக்கில் டாப்-அப் செய்ய",
    sum:"உங்கள் அல்லது அன்புக்குரியவரின் மெடிசேவ் கணக்கில் ரொக்கமாக டாப்-அப் செய்து, ஆண்டுக்கு SGD$8,000 வரை வரிக் கழிவு கோரலாம். இந்த SGD$8,000, உங்கள் சிறப்பு அல்லது ஓய்வுக் கணக்கு டாப்-அப்களுடன் பகிரப்படும்.",
    pts:["மெடிசேவ் கணக்கு பெறக்கூடிய அதிகபட்சத் தொகை, அடிப்படை சுகாதாரத் தொகையிலிருந்து தற்போதைய இருப்பைக் கழித்ததாகும். 65-க்குக் கீழ் உள்ளவர்களுக்கு 2026-இல் அது SGD$79,000.","மெடிசேவ் டாப்-அப்பை மாற்றவோ திரும்பப் பெறவோ முடியாது. வரம்பைத் தாண்டினால், மிகுதி வட்டியின்றி உங்களுக்குத் திருப்பித் தரப்படும்.","2026 ஜனவரி 1 முதல், தகுதியுள்ள உறுப்பினர்களுக்கு மெடிசேவ் டாப்-அப்புகளுக்கு ஆண்டுக்கு SGD$1,000 வரை பொருத்த மானியம் உண்டு. பொருத்தம் பெறும் டாப்-அப்களுக்கு வரிக் கழிவு இல்லை.","துணைவர் அல்லது சகோதர சகோதரிக்கு வரிக் கழிவுடன் டாப்-அப் செய்ய, அவர்களின் முந்தைய ஆண்டு வருமானம் SGD$8,000 அல்லது அதற்குக் குறைவாக இருக்க வேண்டும், அல்லது அவர்கள் மாற்றுத்திறனாளியாக இருக்க வேண்டும்."],
    login:"டாப்-அப் செய்ய Singpass தேவை." },
  a12:{ q:"GIRO மூலம் சிறிய தொடர் டாப்-அப்களை அமைக்கவும்",
    sum:"ஒரே பெரிய தொகையாக டாப்-அப் செய்யத் தேவையில்லை. GIRO மூலம் சிறிய தொடர் ரொக்க டாப்-அப்களை அமைக்கலாம்; ஒவ்வொரு முறையும் படிவம் நிரப்பத் தேவையில்லை.",
    pts:["இது இரண்டு படிகள்: முதலில் உங்கள் வங்கியுடன் GIRO அமைக்கவும், பிறகு ஓய்வுக்கான தொடர் ரொக்க டாப்-அப் கோரிக்கையைச் சமர்ப்பிக்கவும். இரண்டு படிகளும் தேவை.","55 வயதும் அதற்கு மேலும் உள்ளவர்கள், தங்கள் சாதாரணக் கணக்கிலிருந்து தங்கள் ஓய்வுக் கணக்கிற்கு மாதம் சிறு தொகைகளை மாற்றவும் அமைக்கலாம்.","தொடர் ஏற்பாட்டை மாற்ற, அதை நீக்கிவிட்டுப் புதிதாக அமைக்கவும்.","டாப்-அப்களை மாற்ற முடியாது; CPF பணத்தைப் பெற்ற 7 வேலை நாட்களுக்குள் பொதுவாகச் சேர்க்கப்படும்."],
    login:"அமைக்க Singpass தேவை." },
  a13:{ q:"அதிக வட்டிக்காக ஆண்டின் தொடக்கத்தில் டாப்-அப் செய்யுங்கள்",
    sum:"ஆண்டுதோறும் டிசம்பருக்குப் பதிலாக ஜனவரியில் டாப்-அப் செய்தால், 10 ஆண்டுகளில் உங்கள் டாப்-அப்களுக்கு 20% வரை கூடுதல் வட்டி கிடைக்கலாம்; ஏனெனில் CPF வட்டி மாதந்தோறும் கணக்கிடப்பட்டு கூட்டு வட்டியாகச் சேரும்.",
    pts:["CPF-இன் எடுத்துக்காட்டு, 4% வட்டி அடிப்படை, முதல் SGD$60,000-க்கு 2% வரை கூடுதல் வட்டி, ஆண்டுக்கு SGD$8,000 டாப்-அப், தொடக்க இருப்பு SGD$0 எனக் கொள்கிறது.","ஆண்டு இறுதிக்குள் செயலாக்கப்படுவதை உறுதிசெய்ய, ஆண்டின் தொடக்கத்திலேயே டாப்-அப் செய்யுங்கள். டிசம்பரில் பலர் விண்ணப்பிப்பதால் செயலாக்கம் நீளலாம்.","எதிர்காலத் தேவைகளுக்கும் கூடுதல் 1% வட்டிக்கும், உங்கள் சாதாரணக் கணக்கில் குறைந்தது SGD$20,000 வைத்திருக்க CPF பரிந்துரைக்கிறது."] },
  a14:{ q:"உங்கள் CPF பங்களிப்புகள் எங்கே செல்கின்றன என்பதை அறியுங்கள்",
    sum:"உங்கள் CPF பங்களிப்புகள் வயதுக்கேற்ப சாதாரண, சிறப்பு (அல்லது ஓய்வு), மெடிசேவ் கணக்குகளுக்குப் பிரிக்கப்படுகின்றன. இந்தப் பிரிவை அறிந்தால், எதில் டாப்-அப் செய்வது என்று முடிவுசெய்ய உதவும்.",
    pts:["35 வயதும் அதற்குக் கீழும்: சுமார் 62% சாதாரணக் கணக்கிற்கும், 16% சிறப்புக் கணக்கிற்கும், 22% மெடிசேவ்-க்கும். 35-க்கு மேல் 45 வரை: சுமார் 57%, 19%, 24%.","வயது கூடும்போது ஓய்வுக்கும் மெடிசேவ்-க்கும் செல்லும் பங்கு உயரும். 55-க்கு மேல் 60 வரை: சுமார் 35% சாதாரணம், 34% ஓய்வு, 31% மெடிசேவ்.","55 வயதிலிருந்து உங்கள் பங்களிப்புகள் முதலில் முழு ஓய்வுத் தொகை வரை உங்கள் ஓய்வுக் கணக்கிற்குச் செல்லும்."] },
  a15:{ q:"CPF முதலீட்டுத் திட்டத்தில் என் CPF-ஐ முதலீடு செய்ய",
    sum:"CPFIS மூலம் உங்கள் சாதாரண, சிறப்புக் கணக்குச் சேமிப்பின் ஒரு பகுதியை, வெவ்வேறு ஆபத்து நிலைகள் கொண்ட பொருட்களில் முதலீடு செய்யலாம். முதலீடு செய்யாவிட்டால், உங்கள் CPF சேமிப்பு ஆபத்தில்லாத வட்டியைத் தொடர்ந்து ஈட்டும்.",
    pts:["சாதாரணக் கணக்கில் SGD$20,000-ஐ ஒதுக்கிய பின் மீதியையும், சிறப்புக் கணக்கில் SGD$40,000-ஐ ஒதுக்கிய பின் மீதியையும் முதலீடு செய்யலாம்.","சாதாரணக் கணக்கிலிருந்து, முதலீடு செய்யக்கூடிய சேமிப்பில் 35% வரை பங்குகளிலும், 10% வரை தங்கத்திலும் முதலீடு செய்யலாம்.","ஆபத்தில்லாத CPF வட்டியை விட அதிகம் ஈட்ட முடியும் என்ற நம்பிக்கை இருக்கும்போது மட்டுமே முதலீடு செய்யுங்கள் என்று CPF கூறுகிறது. CPFIS முதலீடுகள் CPF நியமனத்தில் அடங்காது."] },
  a16:{ q:"நீங்கள் 1973 அல்லது அதற்கு முன் பிறந்தவர் என்றால் மஜுலா தொகுப்பைப் பாருங்கள்",
    sum:"மஜுலா தொகுப்பு (Majulah Package) 1973 அல்லது அதற்கு முன் பிறந்த சிங்கப்பூர்க் குடிமக்களுக்கு ஆதரவளிக்கிறது. அதன் Earn and Save Bonus, தகுதியுள்ள வேலை செய்யும் மூத்தோருக்கு ஆண்டுக்கு SGD$400 முதல் SGD$1,000 வரை CPF டாப்-அப் தருகிறது; குறைந்த வருமானம் உள்ளவர்களுக்கு அதிகம்.",
    pts:["CPF ஓய்வுச் சேமிப்பு குறைவாக உள்ளவர்களுக்கு ஒருமுறை மட்டும் வழங்கப்படும் ஓய்வுச் சேமிப்பு ஊக்கத்தொகை (அதிகபட்சம் SGD$1,500), மெடிசேவ் ஊக்கத்தொகை (அதிகபட்சம் SGD$2,000) ஆகியவையும் இதில் உண்டு.","1973 அல்லது அதற்கு முன் பிறந்த ஒவ்வொரு சிங்கப்பூரருக்கும் இந்தத் தொகுப்பின் குறைந்தது ஒரு பகுதி கிடைக்கும்.","யார் தகுதி பெறுவார்கள், பணம் எப்போது சேர்க்கப்படும் என்பதை MOM பக்கம் விளக்குகிறது. உங்களுக்கு எது பொருந்தும் என்று பாருங்கள்."] },
  a17:{ q:"சுயதொழில் அல்லது ஃப்ரீலான்ஸரா? உங்கள் CPF-ஐ நீங்களே வளர்க்கவும்",
    sum:"நீங்கள் சுயதொழில் செய்பவராகவும், உங்கள் ஆண்டு நிகர வணிக வருமானம் SGD$6,000-க்கு மேல் இருந்தால், மெடிசேவ்-க்குச் செலுத்த வேண்டும். உங்களுக்காக அதைச் செய்ய முதலாளி இல்லை.",
    pts:["அடிப்படை சுகாதாரத் தொகையை எட்டிய பின்னும் நீங்கள் மெடிசேவ்-க்குச் செலுத்த வேண்டும். அந்தத் தொகைக்கு மேலுள்ள மெடிசேவ் சேமிப்பு முதலில் உங்கள் சிறப்பு அல்லது ஓய்வுக் கணக்கிற்கும், பின்னர் சாதாரணக் கணக்கிற்கும் செல்லும்.","ஓய்வு, வீட்டுச் சேமிப்பை வளர்க்க, CPF சுயதொழில் திட்டத்தின் கீழ் விருப்பப் பங்களிப்புகளையும் செய்யலாம்.","மெடிசேவ் பங்களிப்புகளுக்கும் விருப்பப் பங்களிப்புகளுக்கும் வரிக் கழிவு கிடைக்கலாம். விதிகளை IRAS விளக்குகிறது."] },
  a18:{ q:"போனஸ் CPF-க்கு எப்படிக் கணக்கிடப்படுகிறது என்பதை அறியுங்கள்",
    sum:"போனஸும் பிற கூடுதல் ஊதியமும் கூடுதல் ஊதியமாகக் (Additional Wages) கருதப்படுகின்றன. CPF செலுத்த வேண்டிய தொகைக்கு ஆண்டுதோறும் வரம்பு உண்டு: SGD$102,000-இலிருந்து அந்த ஆண்டு CPF செலுத்தப்பட்ட சாதாரண ஊதியத்தைக் கழித்தது.",
    pts:["எடுத்துக்காட்டு: CPF செலுத்தப்பட்ட உங்கள் சாதாரண ஊதியம் SGD$96,000 (SGD$8,000 மாதம்) என்றால், உங்கள் போனஸில் SGD$6,000-க்கு மட்டுமே CPF பொருந்தும்.","இந்த வரம்பு ஒரு முதலாளிக்கு, ஒரு நாட்காட்டி ஆண்டுக்குப் பொருந்தும்.","போனஸ் வரம்பைத் தாண்டினால், மிகுதிக்கு CPF இல்லை. சிறப்பு அல்லது ஓய்வுக் கணக்கில் ரொக்க டாப்-அப் செய்வது, அதை ஓய்வுச் சேமிப்பில் சேர்க்கும் ஒரு வழி."] },

function t(key, vars){
  const lang = state.settings.lang;
  let s = (UI[lang] && UI[lang][key]) || UI.en[key] || key;
  if (vars) for (const v in vars) s = s.split("{" + v + "}").join(vars[v]);
  return s;
}
function tx(it){
  const o = (TX[state.settings.lang] || {})[it.id] || {};
  return { q:o.q || it.q, sum:o.sum || it.sum, pts:o.pts || it.pts, login:it.login ? (o.login || it.login) : "" };
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const state = { cat:"seniors", openId:null, speaking:false, speakingId:null,

try {
  const saved = JSON.parse(localStorage.getItem("cpfGuideSettings") || "null");
  if (saved && typeof saved === "object") {
    state.settings.audio = !!saved.audio;
    state.settings.speed = saved.speed === "slow" ? "slow" : "normal";
    if (LANGS[saved.lang]) state.settings.lang = saved.lang;

    if (saved.wait === false) state.settings.wait = false;
  }
} catch (e) { /* storage not available: use defaults */ }

const warned = new Set();
function warnOnce(k, m){ if (warned.has(k)) return; warned.add(k); toast(m); }

/* ---------- speech ---------- */
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voices = [];
function loadVoices(){ if (TTS) voices = speechSynthesis.getVoices() || []; }
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const FEMALE = /female|woman|samantha|karen|moira|tessa|veena|fiona|victoria|allison|\bava\b|susan|zira|hazel|heera|linda|catherine|serena|\bkate\b|emma|\bamy\b|joanna|salli|kimberly|\bivy\b|nicole|libby|sonia|natasha|xiaoxiao|xiaoyi|huihui|yaoyao|tingting|ting-ting|sinji|sin-ji|meijia|mei-jia|jenny|\baria\b|michelle|yasmin|amira|pallavi|neerja|swara|shruti|kalpana|lekha|laura|elsa|paulina/i;
const MALE = /(^|[\s_(-])male|\bman\b|daniel|\balex\b|\bfred\b|david|\bmark\b|george|james|richard|\bguy\b|ryan|oliver|rishi|thomas|aaron|arthur|gordon|kangkang|yunxi|yunyang|yunjian|yunze|valluvar|osman|liam|ravi|prabhat|hemant|\bsean\b|jorge|jacques|diego/i;
function genderOf(v){ if (FEMALE.test(v.name)) return "female"; if (MALE.test(v.name)) return "male"; return "unknown"; }
function voiceCandidates(){
  const L = LANGS[state.settings.lang], out = [];
  const add = v => { if (v && !out.includes(v)) out.push(v); };
  for (const l of L.speech) voices.filter(v => v.lang.replace("_","-").toLowerCase() === l.toLowerCase()).forEach(add);
  voices.filter(v => v.lang.toLowerCase().startsWith(L.prefix)).forEach(add);
  return out;
}
function pickVoice(){
  const c = voiceCandidates(), g = state.settings.gender;
  if (g === "any") return { voice:c[0] || null, pitch:1, approx:false };
  const m = c.find(v => genderOf(v) === g);
  if (m) return { voice:m, pitch:1, approx:false };
  return { voice:c[0] || null, pitch:g === "female" ? 1.25 : 0.75, approx:true };
}
const rate = () => state.settings.speed === "slow" ? 0.65 : 1;
let spkToken = 0;
function setSpeaking(on, id){ state.speaking = on; state.speakingId = on ? (id || null) : null; refreshSpeakUI(); }
function stopSpeech(){ spkToken++; if (TTS) speechSynthesis.cancel(); setSpeaking(false); }
function speak(text, opts = {}){
  if (!TTS) { toast(t("noTts")); return; }
  stopSpeech();
  const token = ++spkToken;
  const chunks = (text.match(/[^.!?]+[.!?]*\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
  let i = 0;
  setSpeaking(true, opts.id);
  if (voices.length) {
    const pv0 = pickVoice();
    if (state.settings.lang !== "en" && !pv0.voice) warnOnce("nv" + state.settings.lang, t("noVoice", { lang: LANGS[state.settings.lang].name }));
    else if (pv0.approx) warnOnce("ng" + state.settings.lang + state.settings.gender, t("noGender", { g:t(state.settings.gender === "female" ? "voiceFemale" : "voiceMale").toLowerCase() }));
  }
  const next = () => {
    if (token !== spkToken) return;
    if (i >= chunks.length) { setSpeaking(false); if (opts.onend) opts.onend(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i++]);
    const pv = pickVoice(), v = pv.voice;
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = LANGS[state.settings.lang].speech[0]; }
    u.pitch = pv.pitch;
    u.rate = rate();
    u.onend = next;
    u.onerror = () => { if (token === spkToken) next(); };
    speechSynthesis.speak(u);
  };
  next();
}
function refreshSpeakUI(){
  $("#pill").classList.toggle("on", state.speaking);

/* ---------- demo ---------- */
function getSteps(it, kw){
  const site = it.site || "cpf.gov.sg";
  const sc = (k, v) => t(k, v).split("cpf.gov.sg").join(site);
  const s = [
    { cap:sc("c1"), view:"url" },
    { cap:t("c2"), view:"home", act:"actSearch" },
    { cap:t("c3", { kw }), view:"type" },
    { cap:t("c4", { title:it.title }), view:"results", act:"actResult" },
    { cap:sc("c5"), view:"page" }
  ];
  if (it.login) s.push({ cap:t("c6"), view:"login", act:"actLogin" });
  return s;
}
function stageHTML(view, it, kw){
  const head = `<div class="site-head"><span>${esc(it.site ? t("siteHeadOther", { site:it.site }) : t("siteHead"))}</span><span aria-hidden="true">🔍</span></div>`;

                      <div class="result"><div class="sk" style="width:72%"></div><div class="sk" style="width:55%"></div></div>
                      <button type="button" class="result target" lang="en" data-act="stageAct"><strong>${esc(it.title)}</strong><span class="sk" style="width:78%"></span><span class="tap" aria-hidden="true">👆</span></button>
                      <div class="result"><div class="sk" style="width:62%"></div><div class="sk" style="width:84%"></div></div>`;
    case "page":    return head + `<h4 class="pg-title" lang="en">${esc(it.title)}</h4><span class="found">${esc(t("found"))}</span>` + sk;

  }
