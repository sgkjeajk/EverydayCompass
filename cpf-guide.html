function typeInto(el, text, d, ms){
  clearInterval(d.tt);
  if (!el) return;
  if (REDUCED) { el.textContent = text; return; }
  el.textContent = ""; let i = 0;
  d.tt = setInterval(() => { i++; el.textContent = text.slice(0, i); if (i >= text.length) clearInterval(d.tt); }, ms || 70);
}

/* timing: how long each demo screen stays up */
function isAction(s){ return !!(s.act && state.settings.wait); }
function readMs(text){
  const slow = state.settings.speed === "slow", lang = state.settings.lang;
  let sec;
  if (lang === "zh") sec = (text.match(/[\u4e00-\u9fff]/g) || []).length / (slow ? 3 : 5);
  else {
    const words = text.trim().split(/\s+/).length;
    const wpm = lang === "ta" ? (slow ? 80 : 140) : (slow ? 100 : 180);
    sec = words / wpm * 60;
  }
  return Math.min(25, Math.max(3.5, sec + 1.5)) * 1000;
}
function stepDelay(s, kw){
  const tm = state.settings.timing;
  if (tm !== "auto") return tm * 1000;
  const base = state.settings.speed === "slow" ? 140 : 70;
  const typing = s.view === "type" ? kw.length * base + 1200 : 0;
  return Math.max(readMs(s.cap), typing);
}
function typeMs(s, kw, text){
  const base = state.settings.speed === "slow" ? 140 : 70;
  return Math.max(25, Math.min(base, stepDelay(s, kw) * 0.5 / Math.max(1, text.length)));
}
function stepText(s, n, total){ return t("stepOf", { n, total }) + s.cap; }

function renderDemo(id, speakIt){
  const it = findItem(id), d = demos[id], root = $(`[data-demo="${id}"]`);
  if (!it || !root) return;
  const kw = it.kw[d.kw];
  const steps = getSteps(it, kw);
  d.step = Math.max(0, Math.min(d.step, steps.length - 1));
  const s = steps[d.step], act = isAction(s);
  $(".screen", root).innerHTML = stageHTML(s.view, it, kw);
  const cap = $(".caption", root);
  cap.textContent = stepText(s, d.step + 1, steps.length) + (act ? "\n" + t(s.act) : "");
  cap.classList.toggle("wait", !!d.waiting);
  const pill = $(".urlpill", root);
  if (s.view === "url") typeInto(pill, it.site || "cpf.gov.sg", d, typeMs(s, kw, it.site || "cpf.gov.sg"));
  else { clearInterval(d.tt); pill.textContent = (s.view === "page" || s.view === "login") ? it.url.replace(/^https?:\/\//, "") : "www." + (it.site || "cpf.gov.sg"); }
  if (s.view === "type") typeInto($(".typed", root), kw, d, typeMs(s, kw, kw));
  $('[data-act="prev"]', root).disabled = d.step === 0;
  $('[data-act="next"]', root).disabled = d.step === steps.length - 1;
  $('[data-act="play"]', root).textContent = d.playing ? t("pause") : (d.step === steps.length - 1 ? t("replay") : t("play"));
  $('[data-act="prev"]', root).textContent = t("back");
  $('[data-act="next"]', root).textContent = t("next");
  if (speakIt && state.settings.audio) speak(stepText(s, d.step + 1, steps.length) + (act ? " " + t(s.act) : ""), { id });
}
function stopDemo(id){
  const d = demos[id]; if (!d) return;
  d.playing = false; d.waiting = false; d.gen = (d.gen || 0) + 1;
  clearTimeout(d.timer); clearInterval(d.tt);
  const c = $(`[data-demo="${id}"] .caption`); if (c) c.classList.remove("wait");
}
function stopAllDemos(){ Object.keys(demos).forEach(stopDemo); }
function playLoop(id){
  const it = findItem(id), d = demos[id]; if (!d.playing) return;
  const kw = it.kw[d.kw], steps = getSteps(it, kw), s = steps[d.step], last = d.step >= steps.length - 1;
  const gen = d.gen = (d.gen || 0) + 1;
  d.waiting = false; renderDemo(id, false);
  const act = isAction(s);
  let timerDone = act, speechDone = !state.settings.audio;
  const go = () => {
    if (!d.playing || d.gen !== gen) return;
    if (act) {                       // wait for the person to tap; no timer
      if (!speechDone) return;
      d.waiting = true;
      const c = $(`[data-demo="${id}"] .caption`); if (c) c.classList.add("wait");
      return;
    }
    if (!(timerDone && speechDone)) return;
    if (last) { d.playing = false; renderDemo(id, false); return; }
    d.step++; playLoop(id);
  };
  if (!act) d.timer = setTimeout(() => { timerDone = true; go(); }, stepDelay(s, kw));
  if (state.settings.audio) speak(stepText(s, d.step + 1, steps.length) + (act ? " " + t(s.act) : ""), { id, onend: () => { speechDone = true; go(); } });
  else go();
}

/* ---------- events ---------- */
$("#list").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const art = btn.closest(".item"); const id = art.dataset.id; const it = findItem(id); const d = demos[id];
  switch (btn.dataset.act) {
    case "toggle": {
      stopSpeech(); stopAllDemos();
      state.openId = state.openId === id ? null : id;
      $$(".item").forEach(a => {
        const o = a.dataset.id === state.openId;
        a.classList.toggle("open", o);
        $('[data-act="toggle"]', a).setAttribute("aria-expanded", o);
      });
      Object.keys(demos).forEach(k => { if (k !== state.openId) { demos[k].shown = false; const dm = $(`[data-demo="${k}"]`); if (dm) dm.classList.remove("show"); const db = $('[data-act="demo"]', dm ? dm.closest(".item") : document); if (db) db.setAttribute("aria-expanded", "false"); } });
      if (state.openId) setTimeout(() => art.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" }), 50);
      break;
    }
    case "kw": {
      stopDemo(id); stopSpeech();
      d.kw = +btn.dataset.i; d.step = Math.max(d.step, 2);
      $$('[data-act="kw"]', art).forEach((b, i) => b.setAttribute("aria-pressed", i === d.kw));
      d.shown = true; $(`[data-demo="${id}"]`).classList.add("show");
      $('[data-act="demo"]', art).setAttribute("aria-expanded", "true");
      d.step = 2; renderDemo(id, false);
      break;
    }
    case "listen": {
      if (state.speaking && state.speakingId === id) { stopSpeech(); break; }
      stopAllDemos();
      const X = tx(it);
      speak(`${X.q}. ${X.sum} ${X.pts.join(" ")}`, { id });
      break;
    }
    case "demo": {
      d.shown = !d.shown; stopDemo(id); stopSpeech();
      $(`[data-demo="${id}"]`).classList.toggle("show", d.shown);
      btn.setAttribute("aria-expanded", d.shown);
      if (d.shown) { d.step = 0; renderDemo(id, true); }
      break;
    }
    case "stageAct": {
      const steps = getSteps(it, it.kw[d.kw]), last = d.step >= steps.length - 1;
      if (d.playing) {
        if (!isAction(steps[d.step])) break;
        d.waiting = false; d.gen = (d.gen || 0) + 1; clearTimeout(d.timer); stopSpeech();
        if (last) { d.playing = false; renderDemo(id, false); }
        else { d.step++; d.timer = setTimeout(() => playLoop(id), 350); }
      } else if (!last) {
        stopSpeech(); d.step++; renderDemo(id, true);
      }
      break;
    }
    case "prev": stopDemo(id); stopSpeech(); d.step--; renderDemo(id, true); break;
    case "next": stopDemo(id); stopSpeech(); d.step++; renderDemo(id, true); break;
    case "play": {
      if (d.playing) { stopDemo(id); stopSpeech(); renderDemo(id, false); break; }
      const last = getSteps(it, it.kw[d.kw]).length - 1;
      if (d.step >= last) d.step = 0;
      d.playing = true; playLoop(id);
      break;
    }
  }
});

$$(".tab").forEach(t => t.addEventListener("click", () => {
  if (state.cat === t.dataset.cat) return;
  stopSpeech(); stopAllDemos();
  Object.values(demos).forEach(d => { d.shown = false; d.step = 0; });
  state.cat = t.dataset.cat; state.openId = null;
  render(); window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
}));

/* settings */
const sheet = $("#sheet");
function openSheet(){ sheet.classList.add("open"); $("#audioSwitch").focus(); }
function closeSheet(){ sheet.classList.remove("open"); $("#openSettings").focus(); }
$("#openSettings").addEventListener("click", openSheet);
$("#closeSettings").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
$("#audioSwitch").addEventListener("click", () => {
  state.settings.audio = !state.settings.audio;
  if (!state.settings.audio) stopSpeech();
  else if (!TTS) toast(t("noTts"));
  applyAudioSetting(); saveSettings();
});
function setSpeed(v){ state.settings.speed = v; applyAudioSetting(); saveSettings(); }
$("#spNormal").addEventListener("click", () => setSpeed("normal"));
$("#spSlow").addEventListener("click", () => setSpeed("slow"));
$("#testVoice").addEventListener("click", () => {
  if (!state.settings.audio) { toast(t("audioFirst")); return; }
  speak(t("testSpeech"));
});
$("#stopBtn").addEventListener("click", () => { stopAllDemos(); stopSpeech(); $$('[data-demo]').forEach(r => renderDemo(r.dataset.demo, false)); });
window.addEventListener("pagehide", stopSpeech);

/* language + text size */
function applyLang(){
  const lang = state.settings.lang;
  document.documentElement.lang = LANGS[lang].html;
  document.documentElement.dataset.size = String(state.settings.size);
  document.title = t("title");
  $$("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  $("#openSettings").setAttribute("aria-label", t("settingsBtn"));
  $$("#langSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const sizeNames = { "1":t("sizeNormal"), "2":t("sizeLarge"), "3":t("sizeXL") };
  $$("#sizeSeg button").forEach(b => {
    b.setAttribute("aria-pressed", +b.dataset.size === state.settings.size);
    b.setAttribute("aria-label", sizeNames[b.dataset.size]);
    b.title = sizeNames[b.dataset.size];
  });
  applyMore();
}
function applyMore(){
  $$("#voiceSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.gender === state.settings.gender));
  $$("#timeSeg button").forEach(b => {
    const v = b.dataset.time;
    b.textContent = v === "auto" ? t("timeAuto") : t("sec", { n:v });
    b.setAttribute("aria-pressed", String(state.settings.timing) === v);
  });
  $("#waitSwitch").setAttribute("aria-checked", String(state.settings.wait));
}
$("#voiceSeg").addEventListener("click", e => {
  const b = e.target.closest("[data-gender]"); if (!b) return;
  state.settings.gender = b.dataset.gender; saveSettings(); applyMore();
});
$("#timeSeg").addEventListener("click", e => {
  const b = e.target.closest("[data-time]"); if (!b) return;
  state.settings.timing = b.dataset.time === "auto" ? "auto" : +b.dataset.time; saveSettings(); applyMore();
  Object.keys(demos).forEach(k => { if (demos[k].playing) { stopDemo(k); stopSpeech(); renderDemo(k, false); } });
});
$("#waitSwitch").addEventListener("click", () => {
  state.settings.wait = !state.settings.wait; saveSettings(); applyMore();
  Object.keys(demos).forEach(k => { if (demos[k].shown) { stopDemo(k); stopSpeech(); renderDemo(k, false); } });
});
$("#langSeg").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === state.settings.lang) return;
  stopSpeech(); stopAllDemos();
  state.settings.lang = b.dataset.lang; saveSettings();
  applyLang(); render();
});
$("#sizeSeg").addEventListener("click", e => {
  const b = e.target.closest("[data-size]"); if (!b) return;
  state.settings.size = +b.dataset.size; saveSettings(); applyLang();
});

/* start */
applyAudioSetting();
applyLang();
render();
</script>
<script>
(function(){
  function preserveCpfLanguage(a){
    if(!a.href || !/story[12]\.html/i.test(a.href)) return;
    a.addEventListener('click',function(e){
      if(typeof state==='undefined' || !state.settings || state.settings.lang!=='zh') return;
      e.preventDefault();
      const target=new URL(a.href,location.href).href;
      const url='https://translate.google.com/translate?sl=en&tl=zh-CN&u='+encodeURIComponent(target);
      window.open(url,'_blank','noopener,noreferrer');
    });
  }
  document.querySelectorAll('a[href]').forEach(preserveCpfLanguage);
})();
</script>
</body>
