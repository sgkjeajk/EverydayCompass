<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticker Maintenance</title><style>body{font:16px system-ui;margin:0;background:#f5f7fb;color:#17274a}.w{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:4px}.muted{color:#667085}.box{background:white;border:1px solid #d7deea;border-radius:10px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr 2fr 1fr auto;gap:10px}input,select,button{font:inherit;padding:10px;border:1px solid #c8d1e0;border-radius:6px}button{cursor:pointer;background:#1769d2;color:white;border:0;font-weight:700}.danger{background:#b42318}.secondary{background:#667085}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e7ef;text-align:left}.actions{display:flex;gap:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}textarea{width:100%;min-height:180px}@media(max-width:750px){.grid{grid-template-columns:1fr}.tablewrap{overflow:auto}}</style></head><body><main class="w"><h1>Ticker Maintenance</h1><p class="muted">Standalone personal maintenance file. It is not linked from the public monitor. Changes stay in this browser until you export the configuration.</p><section class="box"><h2>Add / edit ticker</h2><div class="grid"><input id="region" placeholder="Region e.g. US"><input id="ticker" placeholder="Ticker"><input id="name" placeholder="Name"><select id="type"><option>ETF</option><option>Stock</option></select><button id="save">Add Ticker</button></div></section><section class="box"><div class="toolbar"><button id="export">Export JSON</button><label><input id="import" type="file" accept=".json,application/json"> Import JSON</label><button class="secondary" id="reset">Reset defaults</button></div><div class="tablewrap"><table><thead><tr><th>Region</th><th>Ticker</th><th>Name</th><th>Type</th><th>Enabled</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="box"><h2>Configuration preview</h2><textarea id="preview" readonly></textarea></section></main><script>
const KEY='ec-stock-tickers-v2',defaults=[['US','SPY','SPDR S&P 500 ETF Trust','ETF'],['US','VOO','Vanguard S&P 500 ETF','ETF'],['US','QQQ','Invesco QQQ Trust','ETF'],['US','QQQM','Invesco NASDAQ 100 ETF','ETF'],['Global','URTH','iShares MSCI World ETF','ETF'],['US','AAPL','Apple','Stock'],['US','MSFT','Microsoft','Stock'],['US','NVDA','NVIDIA','Stock'],['US','AMZN','Amazon','Stock'],['US','GOOGL','Alphabet Class A','Stock'],['US','META','Meta Platforms','Stock'],['US','TSLA','Tesla','Stock']].map(x=>({region:x[0],ticker:x[1],name:x[2],type:x[3],enabled:true}));let items=JSON.parse(localStorage.getItem(KEY)||'null')||defaults,edit=-1,$=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}function render(){$('rows').innerHTML=items.map((x,i)=>`<tr><td>${x.region}</td><td><b>${x.ticker}</b></td><td>${x.name}</td><td>${x.type}</td><td><input type="checkbox" ${x.enabled?'checked':''} onchange="toggle(${i},this.checked)"></td><td class="actions"><button onclick="ed(${i})">Edit</button><button class="danger" onclick="del(${i})">Delete</button></td></tr>`).join('');$('preview').value=JSON.stringify({instruments:items},null,2)}
window.toggle=(i,v)=>{items[i].enabled=v;persist()};window.del=i=>{if(confirm('Delete '+items[i].ticker+'?')){items.splice(i,1);persist()}};window.ed=i=>{edit=i;let x=items[i];$('region').value=x.region;$('ticker').value=x.ticker;$('name').value=x.name;$('type').value=x.type;$('save').textContent='Save Changes';scrollTo({top:0,behavior:'smooth'})};
$('save').onclick=()=>{let x={region:$('region').value.trim(),ticker:$('ticker').value.trim().toUpperCase(),name:$('name').value.trim(),type:$('type').value,enabled:edit>=0?items[edit].enabled:true};if(!x.region||!x.ticker||!x.name)return alert('Complete Region, Ticker and Name.');if(edit<0&&items.some(y=>y.ticker===x.ticker))return alert('Ticker already exists.');if(edit>=0)items[edit]=x;else items.push(x);edit=-1;['region','ticker','name'].forEach(id=>$(id).value='');$('save').textContent='Add Ticker';persist()};
$('export').onclick=()=>{let b=new Blob([JSON.stringify({instruments:items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='stock-tickers.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text()),a=Array.isArray(j)?j:j.instruments;if(!Array.isArray(a))throw Error();items=a.map(x=>({region:String(x.region||''),ticker:String(x.ticker||'').toUpperCase(),name:String(x.name||''),type:x.type==='Stock'?'Stock':'ETF',enabled:x.enabled!==false}));persist()}catch(err){alert('Invalid configuration JSON.')}};
$('reset').onclick=()=>{if(confirm('Reset to the 12 default instruments?')){items=structuredClone(defaults);persist()}};render();
</script></body></html>
